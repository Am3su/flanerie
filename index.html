<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flânerie – Paris insolite</title>
<meta name="description" content="Voir ce que tout le monde regarde, découvrir ce que personne ne voit : des visites insolites de Paris, racontées et guidées à la voix, rue par rue. Gratuit, sans inscription, hors ligne.">
<meta name="theme-color" content="#14202F">
<meta property="og:type" content="website">
<meta property="og:title" content="Flânerie – Le Paris que personne ne vous raconte">
<meta property="og:description" content="Sept lieux méconnus du Quartier latin à Saint-Germain, racontés à l’oreille et guidés rue par rue. Gratuit, en français, anglais et espagnol.">
<meta property="og:image" content="https://upload.wikimedia.org/wikipedia/commons/thumb/f/fd/Le_Relais_Od%C3%A9on,_Cour_du_Commerce-Saint-Andr%C3%A9,_Paris_2012.jpg/1280px-Le_Relais_Od%C3%A9on,_Cour_du_Commerce-Saint-Andr%C3%A9,_Paris_2012.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Flânerie">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://upload.wikimedia.org" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Jost:wght@300;400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap" rel="stylesheet">
<style>
/* =========================================================
   Flânerie — direction artistique « chic et sobre »
   Papier ivoire, encre bleu nuit, laiton, rouge pour l'insolite,
   gris pour les monuments. Plaque de rue parisienne en signature.
   ========================================================= */
:root{
  --paper:#F6F2EA;--paper-2:#EDE6D8;--card:#FFFDF8;--ink:#181C24;--ink-2:#3F4552;--muted:#767A83;--line:#E0D8C8;
  --navy:#14202F;--accent:#14202F;--on-accent:#F6F2EA;--gold:#A27B3F;--gold-soft:#C9A86A;
  --red:#A32A26;--grey:#9C978D;--river:#C7D5DE;--route:#3F4552;--plaque:#1F3A5F;--frame:#2D6A4F;--gline:#1F3A5F;
  --surface:var(--card);--shadow:0 1px 2px rgba(20,32,47,.06),0 8px 28px rgba(20,32,47,.08);
  --display:"Cormorant Garamond","Cormorant",Garamond,"Times New Roman",serif;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"Jost",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --gut:20px;color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0E131B;--paper-2:#151C27;--card:#19212D;--ink:#EEE9DF;--ink-2:#C9C3B7;--muted:#99958C;--line:#2A3340;
    --accent:#D4B47A;--on-accent:#14202F;--gold:#D4B47A;--gold-soft:#D4B47A;
    --red:#E0675E;--grey:#827E76;--river:#22313F;--route:#C9C3B7;--plaque:#24477A;--frame:#3B7F60;--gline:#8FB0DA;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E131B;--paper-2:#151C27;--card:#19212D;--ink:#EEE9DF;--ink-2:#C9C3B7;--muted:#99958C;--line:#2A3340;
  --accent:#D4B47A;--on-accent:#14202F;--gold:#D4B47A;--gold-soft:#D4B47A;
  --red:#E0675E;--grey:#827E76;--river:#22313F;--route:#C9C3B7;--plaque:#24477A;--frame:#3B7F60;--gline:#8FB0DA;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow-x:hidden}
button,select,input{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
a{color:inherit}
img{max-width:100%}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:0 var(--gut)}
.screen{animation:in .45s cubic-bezier(.2,.7,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}

/* ---------- Typo ---------- */
.kicker{font-family:var(--sans);font-size:12px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.display{font-family:var(--display);font-weight:500;letter-spacing:-.005em;line-height:1.02}
h1,h2,h3{font-family:var(--display);font-weight:500;margin:0;letter-spacing:-.005em}
h1{font-size:40px;line-height:1.04}
h2{font-size:32px;line-height:1.08}
h3{font-size:24px;line-height:1.15}
em.g{font-style:italic;color:var(--gold)}
.lede{font-family:var(--serif);font-size:18px;line-height:1.6;color:var(--ink-2);margin:14px 0 0}
.small{font-size:13px;color:var(--muted)}
.rule{display:flex;align-items:center;gap:12px;color:var(--gold);margin:0 0 14px}
.rule::before,.rule::after{content:"";height:1px;background:currentColor;opacity:.5;flex:0 0 28px}
.rule.c{justify-content:center}

/* ---------- Boutons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:16px 26px;font-size:16px;font-weight:500;letter-spacing:.02em;cursor:pointer;text-decoration:none;transition:transform .15s ease,background .2s ease,box-shadow .2s ease}
.btn:active{transform:scale(.98)}
.btn svg{width:18px;height:18px;flex:none}
.btn.primary{background:var(--accent);color:var(--on-accent);box-shadow:0 6px 18px rgba(20,32,47,.18)}
.btn.ivory{background:#F6F2EA;color:#14202F;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.ghost-light{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.35);color:#F6F2EA;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.btn.block{display:flex;width:100%}
.btn.sm{padding:10px 16px;font-size:14px;font-weight:400;letter-spacing:0}
.btn[disabled]{opacity:.4;cursor:default}
.link{background:none;border:0;padding:8px 0;color:var(--ink-2);text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--line);cursor:pointer;font-size:15px}

/* ---------- Barre haute ---------- */
.top{position:sticky;top:0;z-index:30;padding-top:env(safe-area-inset-top,0px);background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid transparent}
.top.lined{border-bottom-color:var(--line)}
.top-in{max-width:560px;margin:0 auto;padding:0 var(--gut);height:58px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.top .mark{font-family:var(--sans);font-size:13px;font-weight:500;letter-spacing:.32em;text-transform:uppercase;padding-left:.32em}
.icon-btn{width:42px;height:42px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:inherit}
.icon-btn svg{width:22px;height:22px}
.pill{justify-self:end;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 12px 7px 10px;font-size:13px;font-weight:500;letter-spacing:.06em;cursor:pointer}
.pill svg{width:16px;height:16px}
.top.float-top{position:fixed;left:0;right:0;top:0;z-index:30;padding-top:env(safe-area-inset-top,0px);background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;border:0;pointer-events:none}
.float-top .icon-btn,.float-top .pill{pointer-events:auto}
.top.float-top.solid{background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line);pointer-events:auto}
.float-top.solid .glass{background:transparent;color:var(--ink);border-color:var(--line);backdrop-filter:none;-webkit-backdrop-filter:none}
.top.float-top .top-in{transition:none}
.float-top .top-in{grid-template-columns:auto 1fr auto}
.glass{background:rgba(14,19,27,.38);color:#fff;border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.pill.glass{border-color:rgba(255,255,255,.3)}

/* ---------- Accueil (landing) ---------- */
.hero{position:relative;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;color:#F6F2EA;background:#0E131B;overflow:hidden}
.hero-img{position:absolute;inset:0;background-size:cover;background-position:center 40%;transform:scale(1.06);animation:heroZoom 18s ease-out forwards}
@keyframes heroZoom{to{transform:scale(1)}}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,14,20,.6) 0%,rgba(10,14,20,.3) 24%,rgba(10,14,20,.5) 50%,rgba(10,14,20,.94) 100%)}
.hero .top-in{position:relative;z-index:2;width:100%;padding-top:env(safe-area-inset-top,0px);height:auto;min-height:64px;grid-template-columns:1fr auto}
.hero .mark{font-size:14px;letter-spacing:.38em;font-weight:500;text-transform:uppercase}
.hero-body{position:relative;z-index:2;margin-top:auto;max-width:640px;width:100%;margin-left:auto;margin-right:auto;padding:0 var(--gut) calc(26px + env(safe-area-inset-bottom,0px))}
.hero-body>*{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.hero-body>*:nth-child(2){animation-delay:.08s}.hero-body>*:nth-child(3){animation-delay:.16s}.hero-body>*:nth-child(4){animation-delay:.24s}.hero-body>*:nth-child(5){animation-delay:.32s}
.hero .kicker{color:var(--gold-soft)}
.hero h1{font-size:clamp(42px,11.5vw,74px);line-height:.98;margin:14px 0 0;font-weight:500}
.hero h1 em{display:block;font-style:italic;color:#E3C88F;font-weight:500}
.hero .hero-text{font-family:var(--serif);font-size:18px;line-height:1.55;color:rgba(246,242,234,.86);margin:16px 0 0;max-width:34ch}
.hero-cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.perks{display:flex;flex-wrap:wrap;gap:6px 16px;margin:22px 0 0;padding:0;list-style:none;font-size:13px;letter-spacing:.04em;color:rgba(246,242,234,.78)}
.perks li{display:flex;align-items:center;gap:7px}
.perks li::before{content:"";width:5px;height:5px;border-radius:50%;background:#E3C88F}
.picker{margin-top:24px;background:rgba(246,242,234,.97);color:#14202F;border-radius:22px;padding:4px 16px 16px;box-shadow:0 18px 44px rgba(0,0,0,.35);max-width:460px}
.pick{display:grid;grid-template-columns:84px minmax(0,1fr) 18px;align-items:center;gap:8px;width:100%;border:0;border-bottom:1px solid #E0D8C8;background:none;padding:13px 0;text-align:start;cursor:pointer;color:#14202F}
.pk{font-size:11px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:#8A7550}
.pv{font-family:var(--display);font-size:22px;line-height:1.15;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv.muted{color:#767A83;font-style:italic}
.pv .dev{color:#8A7550;border-color:rgba(138,117,80,.4)}
.pick .chev{width:18px;height:18px;color:#9C978D}
.picker .btn{margin-top:14px;background:#14202F;color:#F6F2EA}
[hidden]{display:none!important}
.feature-img{display:block;width:100%;border:0;padding:0;cursor:pointer;text-align:start}
.feature-img .zone{display:block;font-size:14px;color:rgba(246,242,234,.85);margin-top:6px}
.hero .credit-line{font-family:var(--sans);position:relative;z-index:2;font-size:10.5px;line-height:1.4;color:rgba(246,242,234,.55);padding:0 var(--gut) calc(10px + env(safe-area-inset-bottom,0px));max-width:640px;margin:0 auto;width:100%}
.credit-line a{color:inherit}
.scroll-cue{position:absolute;z-index:2;left:50%;bottom:calc(64px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:none}

.sect{padding:64px 0 8px}
.sect h2{font-size:36px}
.dual{display:grid;gap:18px;margin-top:24px}
.dual-card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.dual-card svg{display:block;width:100%;height:auto}
.dual-legend{display:flex;gap:18px;flex-wrap:wrap;padding:14px 18px 16px;font-size:14px;color:var(--ink-2)}
.dual-legend span{display:flex;align-items:center;gap:8px}
.dual-legend i{width:12px;height:12px;border-radius:50%;display:inline-block}
.rules{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:26px}
.rule-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 16px 18px}
.rule-card b{display:block;font-family:var(--display);font-size:30px;font-weight:500;color:var(--gold);line-height:1;font-style:italic}
.rule-card h3{font-size:22px;margin:10px 0 6px}
.rule-card p{margin:0;font-size:14px;line-height:1.5;color:var(--ink-2)}
.feature{margin-top:26px;background:var(--card);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.feature-img{position:relative;aspect-ratio:16/11;max-height:440px;background:var(--paper-2) center/cover no-repeat}
.feature-img::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(10,14,20,.75))}
.feature-img .over{position:absolute;left:18px;right:18px;bottom:16px;z-index:2;color:#F6F2EA}
.feature-img .over h3{font-size:30px;line-height:1.05}
.feature-body{padding:16px 18px 20px}
.strip{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 18px 16px;margin:0 -18px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip figure{flex:0 0 132px;margin:0;scroll-snap-align:start}
.strip img{width:132px;height:96px;object-fit:cover;border-radius:12px;display:block;background:var(--paper-2)}
.strip figcaption{font-size:13px;line-height:1.3;margin-top:7px;color:var(--ink-2)}
.strip figcaption b{color:var(--red);font-weight:500;margin-inline-end:4px}
.how{list-style:none;padding:0;margin:26px 0 0;display:grid;gap:4px}
.how li{display:grid;grid-template-columns:54px 1fr;gap:6px;padding:16px 0;border-top:1px solid var(--line)}
.how li:last-child{border-bottom:1px solid var(--line)}
.how b{font-family:var(--display);font-style:italic;font-size:34px;line-height:1;color:var(--gold);font-weight:500}
.how h3{font-size:23px}
.how p{margin:4px 0 0;font-size:15px;color:var(--ink-2);line-height:1.5}
.closing{text-align:center;padding:64px 0 24px}
.closing h2{font-size:38px;line-height:1.05}
.foot{padding:28px 0 calc(40px + env(safe-area-inset-bottom,0px));text-align:center;font-size:12.5px;line-height:1.6;color:var(--muted)}
.foot .mark{font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--ink);font-weight:500;display:block;margin-bottom:8px}

/* ---------- Composer ma visite (ville → langue → parcours) ---------- */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 0}
.steps button{border:0;background:none;padding:10px 0 0;text-align:start;cursor:pointer;position:relative;font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.steps button::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;border-radius:2px;background:var(--line)}
.steps button.past::before,.steps button.on::before{background:var(--gold)}
.steps button.on{color:var(--ink)}
.steps button[disabled]{cursor:default}
.steps .v{display:block;font-size:13px;letter-spacing:0;text-transform:none;font-weight:400;color:var(--ink-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q{margin:30px 0 0}
.q h1{font-size:44px}
.q .lede{margin-top:8px;font-size:17px}
.step-body{margin-top:24px;animation:in .45s cubic-bezier(.2,.7,.2,1)}

.city-main{position:relative;display:block;width:100%;border:0;padding:0;border-radius:22px;overflow:hidden;cursor:pointer;text-align:start;color:#F6F2EA;aspect-ratio:4/3.1;background:#14202F center/cover no-repeat;box-shadow:var(--shadow)}
.city-main::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,14,20,.05) 35%,rgba(10,14,20,.82))}
.city-main .in{position:absolute;z-index:2;left:20px;right:20px;bottom:18px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.city-main .name{font-family:var(--display);font-size:54px;line-height:.9;font-weight:500}
.city-main .meta{display:block;font-size:14px;letter-spacing:.04em;color:rgba(246,242,234,.82);margin-top:8px}
.city-main .go{flex:none;width:48px;height:48px;border-radius:50%;background:#F6F2EA;color:#14202F;display:grid;place-items:center}
.city-main .go svg{width:20px;height:20px}
.city-main.sel{outline:3px solid var(--gold);outline-offset:3px}
.city-soon{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.city-soon div{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:3/4;background:#202a36 center/cover no-repeat;color:#F6F2EA;filter:grayscale(1)}
.city-soon div::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,14,20,.2),rgba(10,14,20,.78))}
.city-soon span{position:absolute;z-index:2;left:10px;right:8px;bottom:10px;font-family:var(--display);font-size:22px;line-height:1}
.city-soon small{display:block;font-family:var(--sans);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;margin-top:5px;color:rgba(246,242,234,.8)}

.langs{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.langs button{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:15px 2px;text-align:start;cursor:pointer}
.langs .n{font-family:var(--display);font-size:27px;line-height:1.1;font-weight:500}
.langs .s{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.langs .tag{font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.langs .tick{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center}
.langs .tick svg{width:15px;height:15px;opacity:0}
.langs button[aria-checked="true"] .tick{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.langs button[aria-checked="true"] .tick svg{opacity:1}
.langs button[aria-checked="true"] .n{color:var(--ink)}
.langs button[disabled]{cursor:default}
.langs button[disabled] .n{color:var(--muted)}
.dev{display:inline-block;font-size:10.5px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);border-radius:999px;padding:2px 8px;margin-inline-start:8px;vertical-align:4px;font-family:var(--sans)}
.notice{font-size:14px;line-height:1.5;color:var(--ink-2);background:var(--paper-2);border-radius:14px;padding:12px 14px;margin:0 0 16px}
.sticky-cta{position:sticky;bottom:0;z-index:20;padding:16px 0 calc(16px + env(safe-area-inset-bottom,0px));margin-top:22px;background:linear-gradient(180deg,transparent,var(--paper) 30%)}

.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 calc(var(--gut) * -1);padding:2px var(--gut) 4px}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible;margin:0;padding:0}
.chip{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 15px;font-size:14px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip[disabled]{cursor:default;color:var(--muted)}
.chip small{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;margin-inline-start:6px;color:var(--gold)}
.facet{font-size:11.5px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}

.rcard{display:block;width:100%;border:0;padding:0;margin:0 0 16px;background:var(--card);border-radius:22px;overflow:hidden;text-align:start;cursor:pointer;box-shadow:var(--shadow);transition:transform .2s ease}
.rcard:active{transform:scale(.99)}
.rcard .img{display:block;position:relative;aspect-ratio:16/10;background:var(--paper-2) center/cover no-repeat}
.rcard .img .tags{position:absolute;left:12px;top:12px;display:flex;gap:6px;flex-wrap:wrap}
.tagi{font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;border-radius:999px;padding:5px 10px;background:rgba(14,19,27,.55);color:#F6F2EA;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.tagi.gold{background:#E3C88F;color:#14202F}
.rcard .rb{display:block;padding:16px 18px 18px}
.rcard h3{font-size:26px;line-height:1.1}
.rcard .zone{font-size:14px;color:var(--muted);margin-top:4px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:14px;color:var(--ink-2)}
.meta span{display:inline-flex;align-items:center;gap:6px}
.meta svg{width:16px;height:16px;color:var(--gold);flex:none}
.feature-body .meta{margin:0 0 14px}
.rcard.compact{display:grid;grid-template-columns:104px 1fr;align-items:stretch;border-radius:18px}
.rcard.compact .img{aspect-ratio:auto;min-height:118px}
.rcard.compact .rb{padding:14px 14px 14px 16px}
.rcard.compact h3{font-size:21px}
.rcard.compact .meta{margin-top:8px;font-size:13px}
.empty{font-family:var(--serif);color:var(--muted);text-align:center;padding:30px 0}

/* ---------- Badges ---------- */
.badge{display:inline-block;font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;border-radius:999px;padding:4px 10px;vertical-align:middle}
.badge.free{background:color-mix(in srgb,var(--frame) 15%,transparent);color:var(--frame)}
.badge.paid{background:color-mix(in srgb,var(--red) 13%,transparent);color:var(--red)}

/* ---------- Plaque de rue (signature) ---------- */
.plaque{display:inline-block;background:var(--plaque);color:#fff;border:4px solid var(--frame);border-radius:10px;box-shadow:inset 0 0 0 2px var(--plaque),inset 0 0 0 3.5px rgba(255,255,255,.92);padding:8px 16px 9px;text-align:center}
.plaque .arr{display:block;font-size:11px;font-weight:400;opacity:.92;line-height:1.2}
.plaque .street{display:block;font-weight:500;font-size:16px;letter-spacing:.06em;text-transform:uppercase;line-height:1.15}
.plaque.big{padding:14px 24px 16px;border-width:5px;border-radius:12px}
.plaque.big .street{font-size:30px;letter-spacing:.07em}
.plaque.big .arr{font-size:13px}

/* ---------- Parcours ---------- */
.cover{position:relative;min-height:62vh;min-height:62svh;max-height:640px;display:flex;flex-direction:column;justify-content:flex-end;color:#F6F2EA;background:#14202F center/cover no-repeat}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,14,20,.5) 0%,rgba(10,14,20,.15) 25%,rgba(10,14,20,.45) 55%,rgba(10,14,20,.92) 100%)}
.cover .wrap{position:relative;z-index:2;width:100%;padding-bottom:26px}
.cover h1{font-size:clamp(38px,10vw,56px);line-height:1}
.cover .zone{margin-top:10px;font-size:15px;color:rgba(246,242,234,.85);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cover .kicker{color:#E3C88F}
.cover .credit{position:absolute;z-index:2;right:10px;bottom:6px;font-size:9.5px;color:rgba(246,242,234,.5);max-width:70%;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cover .credit a{color:inherit}
.facts{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-radius:18px;box-shadow:var(--shadow);margin-top:-22px;position:relative;z-index:3}
.facts div{padding:16px 10px 14px;text-align:center}
.facts div+div{border-left:1px solid var(--line)}
.facts b{display:block;font-family:var(--display);font-size:23px;white-space:nowrap;font-weight:500;line-height:1.1}
.facts span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.intro{font-family:var(--serif);font-size:19px;line-height:1.62;margin:28px 0 0}
.intro::first-letter{font-family:var(--display);float:left;font-size:64px;line-height:.82;padding:6px 10px 0 0;color:var(--gold);font-weight:500}
.map{background:var(--card);border-radius:20px;overflow:hidden;box-shadow:var(--shadow);margin-top:16px}
.map svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;font-size:13px;color:var(--ink-2);padding:12px 16px 14px;border-top:1px solid var(--line)}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:44px 0 6px}
.sec-title h2{font-size:30px}
ol.timeline{list-style:none;margin:8px 0 0;padding:0}
.tl{display:grid;grid-template-columns:34px 1fr;column-gap:14px}
.tl .rail{display:flex;flex-direction:column;align-items:center}
.num{width:30px;height:30px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:500;flex:none;font-family:var(--sans)}
.num.sm{width:24px;height:24px;font-size:12px;display:inline-grid;vertical-align:middle}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--grey);flex:none}
.tl .rail .line{flex:1;width:1px;background:repeating-linear-gradient(180deg,var(--line) 0 4px,transparent 4px 8px);min-height:18px;margin:6px 0}
.tl-btn{display:grid;grid-template-columns:76px 1fr;gap:14px;align-items:center;width:100%;border:0;background:none;padding:0 0 4px;text-align:start;cursor:pointer}
.tl-btn img,.tl-btn .ph{width:76px;height:76px;border-radius:14px;object-fit:cover;display:block;background:var(--paper-2)}
.tl-btn .t{font-family:var(--display);font-size:22px;line-height:1.1;font-weight:500}
.tl-btn .h{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-family:var(--serif);font-size:14.5px;line-height:1.45;color:var(--ink-2);margin-top:4px}
.tl.std .rail{padding-top:9px}
.tl.std .tl-btn{grid-template-columns:1fr;padding:6px 0 4px}
.tl.std .t{font-family:var(--sans);font-size:15px;color:var(--ink-2)}
.tl.std .h{font-family:var(--sans);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);-webkit-line-clamp:1}
.tl.leg{font-size:13px;color:var(--muted);min-height:34px}
.tl.leg .rail .line{margin:0}
.tl.leg span{align-self:center;display:inline-flex;align-items:center;gap:6px}
.tl.leg svg{width:15px;height:15px}
.tl.leg.metro .rail .line{width:3px;background:var(--plaque);border-radius:2px}
.dock{position:sticky;bottom:0;z-index:20;margin-top:28px;padding:14px 0 calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,transparent,var(--paper) 26%)}
.dock-sub{display:flex;align-items:center;justify-content:center;gap:6px 16px;flex-wrap:wrap;margin-top:6px}
.offline{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--frame)}
.offline svg{width:14px;height:14px}

/* ---------- Fiche lieu ---------- */
.gallery{position:relative;background:#14202F}
.gallery .track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.gallery .track::-webkit-scrollbar{display:none}
.gallery figure{flex:0 0 100%;margin:0;scroll-snap-align:center;position:relative}
.gallery img{display:block;width:100%;height:min(60vh,540px);object-fit:cover;background:#1b2531}
.gallery figure.broken{display:none}
.gallery::after{content:"";position:absolute;left:0;right:0;top:0;height:110px;background:linear-gradient(180deg,rgba(10,14,20,.5),transparent);pointer-events:none}
.gdots{position:absolute;z-index:3;left:0;right:0;bottom:12px;display:flex;justify-content:center;gap:6px}
.gdots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.5)}
.gdots i.on{background:#fff;width:18px;border-radius:3px}
.tasl{font-size:11.5px;line-height:1.45;color:var(--muted);padding:9px var(--gut) 0;max-width:560px;margin:0 auto}
.tasl a{color:inherit}
.tasl .cand{font-style:italic}
.no-photo{display:grid;place-items:center;height:240px;background:var(--paper-2);color:var(--muted);font-family:var(--serif);font-style:italic}
.progress{display:flex;gap:4px;margin:18px 0 18px}
.progress span{flex:1;height:3px;border-radius:2px;background:var(--line)}
.progress span.on{background:var(--red)}
.place-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.step-k{font-size:12px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--red);display:flex;align-items:center;gap:10px}
.std-k{color:var(--muted)}
.place h1{font-size:42px;margin-top:16px}
.hook{font-family:var(--serif);font-style:italic;font-size:21px;line-height:1.45;color:var(--ink-2);margin:12px 0 0}
.body{font-family:var(--serif);font-size:18.5px;line-height:1.72;margin:26px 0 0}
.body p{margin:0 0 1.05em}
.body p:first-child::first-letter{font-family:var(--display);float:left;font-size:70px;line-height:.8;padding:7px 10px 0 0;color:var(--red);font-weight:500}
mark.verif{background:color-mix(in srgb,#E0A100 22%,transparent);color:inherit;font-family:var(--sans);font-size:.62em;letter-spacing:.08em;text-transform:uppercase;padding:1px 6px;border-radius:4px;white-space:nowrap;vertical-align:2px}
.panel{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:18px 18px 18px;margin-top:22px}
.panel h3{font-family:var(--sans);font-size:11.5px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.panel .acc{display:flex;gap:12px;align-items:flex-start}
.panel .acc p{margin:0;font-size:15px;line-height:1.5}
.panel .addr{margin:14px 0 0;padding-top:14px;border-top:1px solid var(--line);font-size:15px}
.panel .addr span{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.actions .btn{color:var(--ink)}
.near{display:grid;grid-template-columns:64px 1fr 20px;align-items:center;gap:14px;width:100%;border:0;background:var(--card);box-shadow:var(--shadow);border-radius:18px;padding:10px 14px 10px 10px;text-align:start;cursor:pointer;margin-top:14px}
.near img,.near .ph{width:64px;height:64px;border-radius:12px;object-fit:cover;display:block;background:var(--paper-2)}
.near .k{display:flex;align-items:center;gap:8px;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.near .t{display:block;font-family:var(--display);font-size:21px;line-height:1.15;margin-top:3px}
.near .chev{width:18px;height:18px;color:var(--muted)}
.sources{font-size:13.5px;line-height:1.55;color:var(--muted);margin:22px 0 0}
.pager{display:grid;grid-template-columns:auto 1fr;gap:10px;margin-top:28px}
.pager .btn.ghost{padding:16px 20px}
.next-leg{font-size:13px;color:var(--muted);text-align:end;margin:10px 4px 0}

/* ---------- Lecteur audio ---------- */
.player{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:0 12px calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none}
.player-in{pointer-events:auto;max-width:536px;margin:0 auto;display:flex;align-items:center;gap:14px;background:var(--navy);color:#F6F2EA;border-radius:20px;padding:10px 12px 10px 10px;box-shadow:0 12px 34px rgba(10,14,20,.32)}
:root[data-theme="dark"] .player-in{background:#222C3A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .player-in{background:#222C3A}}
.play{flex:none;width:48px;height:48px;border-radius:50%;border:0;background:#E3C88F;color:#14202F;display:grid;place-items:center;cursor:pointer}
.play svg{width:20px;height:20px}
.play[disabled]{opacity:.4}
.ptext{flex:1;min-width:0}
.ptext b{display:block;font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptext span{display:block;font-size:12.5px;color:rgba(246,242,234,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.speed{flex:none;border:1px solid rgba(246,242,234,.3);background:transparent;color:#F6F2EA;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.wave{display:inline-flex;gap:2px;align-items:flex-end;height:12px;margin-inline-end:6px;vertical-align:-1px}
.wave i{width:2px;background:#E3C88F;border-radius:1px;animation:wave 1s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.15s}.wave i:nth-child(3){animation-delay:.3s}.wave i:nth-child(4){animation-delay:.45s}
@keyframes wave{0%,100%{height:3px}50%{height:12px}}
.has-player{padding-bottom:96px}

/* ---------- Guide vocal ---------- */
.gcard{display:grid;grid-template-columns:56px 1fr;column-gap:16px;align-items:center;background:var(--navy);color:#F6F2EA;border-radius:22px;padding:20px;margin-top:20px;min-height:112px;box-shadow:0 12px 30px rgba(10,14,20,.22)}
:root[data-theme="dark"] .gcard{background:#222C3A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .gcard{background:#222C3A}}
.g-ico{grid-row:1/span 3;width:56px;height:56px;border-radius:50%;background:#E3C88F;color:#14202F;display:grid;place-items:center}
.g-ico svg{width:28px;height:28px}
.g-dist{font-family:var(--display);font-size:34px;font-weight:500;line-height:1}
.g-dist:empty,.g-name:empty{display:none}
.g-instr{font-size:18px;font-weight:500;line-height:1.3}
.g-name{font-size:15px;opacity:.8;line-height:1.35}
.g-then{font-size:14px;color:var(--muted);margin:12px 4px 0;min-height:1.45em}
.g-status{font-size:14px;line-height:1.45;background:var(--paper-2);border-radius:14px;padding:11px 14px;margin:12px 0 0}
.g-status:empty{display:none}
.g-map:empty{display:none}
.g-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.gfacts{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border-radius:18px;box-shadow:var(--shadow);margin-top:14px}
.gfacts div{padding:14px 16px}
.gfacts div+div{border-left:1px solid var(--line)}
.gfacts b{display:block;font-family:var(--display);font-size:26px;font-weight:500;line-height:1.1}
.gfacts span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* ---------- Fin ---------- */
.done{text-align:center;padding:56px 0 40px}
.done .lede{margin:22px auto 0;max-width:30ch}
.done blockquote{font-family:var(--display);font-style:italic;font-size:28px;line-height:1.2;margin:30px auto 0;max-width:22ch;color:var(--ink)}
.done .row{display:grid;gap:10px;margin-top:34px}

/* ---------- Feuille de langue ---------- */
.sheet-bg{position:fixed;inset:0;z-index:60;background:rgba(10,14,20,.45);animation:fade .2s ease}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-width:560px;margin:0 auto;background:var(--paper);border-radius:24px 24px 0 0;padding:10px var(--gut) calc(20px + env(safe-area-inset-bottom,0px));max-height:86vh;overflow:auto;animation:rise .3s cubic-bezier(.2,.7,.2,1)}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 16px}
.sheet h2{font-size:28px;margin-bottom:14px}

.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--paper);font-size:14px;padding:10px 18px;border-radius:999px;box-shadow:0 4px 18px rgba(0,0,0,.18);animation:fade .2s ease}
.loading{min-height:100vh;display:grid;place-items:center;font-size:13px;letter-spacing:.32em;text-transform:uppercase;color:var(--muted)}

@media (min-width:760px){
  :root{--gut:28px}
  .hero-body{padding-bottom:48px}
  .hero p{font-size:20px}
  .rules{grid-template-columns:repeat(4,1fr)}
  .sect h2{font-size:44px}
  .wrap.wide{max-width:980px}
  .land-grid{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
  .cover{min-height:56vh}
}
@media (min-width:900px){
  .hero .top-in{max-width:1080px;margin:0 auto;padding-left:var(--gut);padding-right:var(--gut)}
  .hero::after{background:linear-gradient(90deg,rgba(10,14,20,.88) 0%,rgba(10,14,20,.6) 42%,rgba(10,14,20,.25) 100%),linear-gradient(180deg,rgba(10,14,20,.45),transparent 30%,transparent 65%,rgba(10,14,20,.85))}
  .hero-body{max-width:1080px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);column-gap:56px;align-items:end;padding-bottom:40px}
  .hero-body .kicker,.hero-body h1,.hero-body .hero-text,.hero-body .perks{grid-column:1}
  .hero h1{font-size:clamp(52px,5.6vw,76px)}
  .picker{grid-column:2;grid-row:1/span 4;align-self:end;margin:0;width:100%}
  .hero .credit-line{max-width:1080px}
  .feature-img{aspect-ratio:21/9}
}

/* ---------- Arabe (de droite à gauche) et chinois ---------- */
svg{direction:ltr}
:root[lang="ar"]{--display:"Noto Naskh Arabic","Geeza Pro","Times New Roman",serif;--serif:"Noto Naskh Arabic","Geeza Pro",serif;--sans:"Noto Sans Arabic","Geeza Pro",system-ui,sans-serif}
:root[lang="zh"]{--display:"Noto Serif SC","Songti SC","STSong",serif;--serif:"Noto Serif SC","Songti SC",serif;--sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
:root[lang="ar"] *{letter-spacing:0!important}
:root[lang="zh"] .kicker,:root[lang="zh"] .facet,:root[lang="zh"] .steps button,:root[lang="zh"] .tagi,:root[lang="zh"] .badge,:root[lang="zh"] .pk,:root[lang="zh"] .step-k{letter-spacing:.06em}
:root[lang="ar"] em,:root[lang="ar"] .hook,:root[lang="ar"] .pv.muted,:root[lang="ar"] blockquote,:root[lang="ar"] .tasl .cand,:root[lang="zh"] em,:root[lang="zh"] .hook,:root[lang="zh"] .pv.muted,:root[lang="zh"] blockquote,:root[lang="zh"] .tasl .cand{font-style:normal}
:root[lang="ar"] .intro::first-letter,:root[lang="ar"] .body p:first-child::first-letter,:root[lang="zh"] .intro::first-letter,:root[lang="zh"] .body p:first-child::first-letter{float:none;font:inherit;padding:0;color:inherit;line-height:inherit}
:root[lang="ar"] h1,:root[lang="zh"] h1{line-height:1.3}
:root[lang="ar"] h2,:root[lang="ar"] h3,:root[lang="zh"] h2,:root[lang="zh"] h3{line-height:1.35}
:root[lang="ar"] .hero h1,:root[lang="zh"] .hero h1{font-size:clamp(34px,9vw,60px);line-height:1.25}
:root[lang="ar"] .q h1,:root[lang="zh"] .q h1{font-size:36px}
:root[lang="ar"] .place h1,:root[lang="zh"] .place h1{font-size:34px}
:root[lang="ar"] .cover h1,:root[lang="zh"] .cover h1{font-size:clamp(30px,8vw,46px)}
:root[lang="ar"] .body,:root[lang="ar"] .intro{line-height:1.95}
:root[lang="zh"] .body,:root[lang="zh"] .intro{line-height:1.9;text-align:justify}
:root[lang="ar"] .langs .n,:root[lang="zh"] .langs .n,:root[lang="ar"] .pv,:root[lang="zh"] .pv{font-size:21px}
[dir="rtl"] .btn svg,[dir="rtl"] .icon-btn svg,[dir="rtl"] .chev,[dir="rtl"] .city-main .go svg{transform:scaleX(-1)}
[dir="rtl"] .cover .credit{right:auto;left:10px;text-align:left}

/* ---------- Cartes réelles ---------- */
.map-real{position:relative;height:340px;background:var(--card);overflow:hidden}
.map-real.tall{height:420px}
.map-real .fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.map-real .fallback svg{width:100%;height:100%}
.map-real .mapgl,.g-wrap .mapgl{position:absolute;inset:0}
.map-real:not(.live) .mapgl,.g-wrap:not(.live) .mapgl{opacity:0;pointer-events:none}
.map-real.live .fallback{display:none}
.dual-card .map-real{height:330px}
.g-wrap{position:relative}
.g-wrap.live{height:360px}
.g-wrap.live #g-map{display:none}
.g-wrap:not(.live):has(#g-map:empty){display:none}
.map-ui{position:absolute;z-index:3;left:10px;top:10px;display:flex;gap:2px;background:rgba(255,255,255,.94);border-radius:999px;padding:3px;box-shadow:0 1px 5px rgba(0,0,0,.22);font-family:var(--sans)}
.map-ui button{border:0;background:transparent;border-radius:999px;padding:6px 11px;font-size:12px;font-weight:500;color:#3C4043;cursor:pointer;letter-spacing:0}
.map-ui button[aria-pressed="true"]{background:#14202F;color:#fff}
[dir="rtl"] .map-ui{left:auto;right:10px}
.open-in{margin-inline-start:auto;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px}
.open-in svg{width:14px;height:14px}
.mk{cursor:pointer}
.mk-a{width:30px;height:30px;border-radius:50%;background:var(--red);color:#fff;font:600 13px/1 var(--sans);display:grid;place-items:center;border:2.5px solid #fff;box-shadow:0 2px 7px rgba(0,0,0,.35);position:relative}
.mk-a::after{content:"";position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);border:5px solid transparent;border-top:6px solid #fff;border-bottom:0}
.mk-a.st{background:#1F3A5F}
.mk-g{width:28px;height:40px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
.mk-g svg{display:block}
.mk-m{width:15px;height:15px;border-radius:50%;background:#8E8A82;border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.mk-me{width:20px;height:20px;border-radius:50%;background:var(--me,#1A73E8);border:3px solid #fff;box-shadow:0 0 0 0 color-mix(in srgb,var(--me,#1A73E8) 40%,transparent),0 1px 4px rgba(0,0,0,.3);animation:me 2s ease-out infinite}
@keyframes me{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--me,#1A73E8) 45%,transparent),0 1px 4px rgba(0,0,0,.3)}100%{box-shadow:0 0 0 18px transparent,0 1px 4px rgba(0,0,0,.3)}}
.fl-pop .maplibregl-popup-content{padding:0;border-radius:16px;overflow:hidden;background:var(--card);color:var(--ink);box-shadow:0 10px 30px rgba(10,14,20,.28);font-family:var(--sans)}
.fl-pop.maplibregl-popup-anchor-bottom .maplibregl-popup-tip{border-top-color:var(--card)}
.fl-pop.maplibregl-popup-anchor-top .maplibregl-popup-tip{border-bottom-color:var(--card)}
.fl-pop .maplibregl-popup-close-button{width:28px;height:28px;font-size:18px;color:#fff;background:rgba(10,14,20,.45);border-radius:50%;top:6px;right:6px}
.pop img{display:block;width:250px;height:120px;object-fit:cover;background:var(--paper-2)}
.pop-b{padding:12px 14px 14px}
.pop-k{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.pop b{display:block;font-family:var(--display);font-size:20px;font-weight:500;line-height:1.15;margin-top:6px}
.pop p{margin:6px 0 0;font-family:var(--serif);font-size:14px;line-height:1.45;color:var(--ink-2)}
.pop .btn{margin-top:10px;width:100%}
.maplibregl-ctrl-group{border-radius:12px!important;overflow:hidden}
.maplibregl-ctrl-attrib{font-family:var(--sans);font-size:10px}
</style>

/* ---------- Contenu : catalogue + un fichier JSON par parcours et par langue (format du CDC) ---------- */
const DB={catalog:null,content:{}};
async function loadJSON(u){const r=await fetch(u,{cache:"no-cache"});if(!r.ok)throw new Error(u+" "+r.status);return r.json()}
async function loadLang(lang){
  if(DB.content[lang])return;
  const out={};
  await Promise.all(DB.catalog.parcours.filter(p=>p.langues.includes(lang)).map(async p=>{out[p.parcours_id]=prep(await loadJSON(p.fichier.replace("{langue}",lang)))}));
  DB.content[lang]=out;
}
function prep(r){r.ins=r.etapes.filter(e=>e.type==="insolite").sort((a,b)=>a.ordre-b.ordre);r.std=r.etapes.filter(e=>e.type==="standard");
  r.byId=Object.fromEntries(r.etapes.map(e=>[e.id,e]));return r}

const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const ACTIVE_LANGS=Object.keys(I18N);
function deviceLang(){const l=((navigator.languages&&navigator.languages[0])||navigator.language||"fr").slice(0,2).toLowerCase();return l}
function defaultLang(){const d=deviceLang();return ACTIVE_LANGS.includes(d)?d:(d==="fr"?"fr":"en")}
function savedLang(){const s=store.get("flanerie-lang");return s&&I18N[s]?s:defaultLang()}
function loadVoice(){return store.get("flanerie-voice")!=="off"}
const state={lang:savedLang(),langChosen:!!store.get("flanerie-lang"),city:store.get("flanerie-city")||"paris",theme:"insolite",filter:"all",step:1,
  screen:"loading",route:null,idx:0,mon:null,back:"route",rate:1,guided:false,autoplay:false,voice:loadVoice(),offline:{}};

const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const routeById=id=>(DB.content[state.lang]||DB.content.fr||{})[id]||(DB.content.fr||{})[id];
const cur=()=>routeById(state.route);
const stopAt=i=>cur().ins[i];

const paras=s=>String(s||"").split(/\n\s*\n/).map(p=>p.trim()).filter(Boolean);

/* Photos (Wikimedia Commons, ligne TASL obligatoire) */
const phURL=(p,w)=>!p?"":(w&&/\/960px-/.test(p.fichier)?p.fichier.replace("/960px-",`/${w}px-`):p.fichier);
const firstPhoto=e=>e&&e.photos&&e.photos.length?e.photos[0]:null;
const coverOf=r=>{const c=DB.catalog&&DB.catalog.parcours.find(p=>p.parcours_id===r.parcours_id);if(c&&c.couverture)return c.couverture;for(const e of r.ins){const p=firstPhoto(e);if(p)return p}return null};
const tasl=p=>!p?"":`${esc(p.titre)} — ${esc(p.auteur)} — <a href="${esc(p.source_url)}" target="_blank" rel="noopener">${esc(p.source)}</a> — ${p.licence_url?`<a href="${esc(p.licence_url)}" target="_blank" rel="noopener">${esc(p.licence)}</a>`:esc(p.licence)}`;

const imgTag=(p,w,alt,cls="")=>p?`<img${cls?` class="${cls}"`:""} src="${esc(phURL(p,w))}" alt="${esc(alt||p.titre)}" loading="lazy" decoding="async" referrerpolicy="no-referrer">`:`<span class="ph${cls?" "+cls:""}"></span>`;

/* Parcours : format et catalogue de la ville */
const fmtOf=r=>(r.mode==="pied_metro"||r.duree.max>=360)?"day":(r.duree.max<=150?"2h":"half");
const routesOf=(city,theme)=>DB.catalog.parcours.filter(p=>p.ville===city&&(!theme||p.thematique===theme)).map(p=>routeById(p.parcours_id)).filter(Boolean).sort((a,b)=>(a.exemple?1:0)-(b.exemple?1:0));
const featured=()=>routesOf("paris","insolite").find(r=>!r.exemple)||routesOf("paris","insolite")[0];
const cityById=id=>DB.catalog.villes.find(v=>v.id===id);

const langName=c=>(LANGS.find(l=>l[0]===c)||[c,c])[1];

/* ---------- Géo ---------- */
function dist(a,b){const R=6371000,r=Math.PI/180,dLa=(b.lat-a.lat)*r,dLo=(b.lng-a.lng)*r;
  const h=Math.sin(dLa/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
const legOf=(r,a,b)=>(r.trajets||[]).find(l=>l.de===a&&l.vers===b);
const walkMinutes=(a,b)=>Math.max(2,Math.round(dist(ll(a),ll(b))*1.3/75));
const kmTxt=r=>{const tr=MAPS.traces[r.parcours_id];return (tr?Math.round(tr.distance_pied_m/100)/10:(r.distance_km||0)).toLocaleString(NUMLOC())};
const legMin=(r,a,b)=>{const tr=MAPS.traces[r.parcours_id],f=tr&&tr.features.find(x=>x.properties.de===a.id&&x.properties.vers===b.id);return f?Math.max(1,Math.round(f.properties.duree_s/60)):walkMinutes(a,b)};
const isApple=/iPad|iPhone|iPod/.test(navigator.userAgent)||(/Macintosh/.test(navigator.userAgent)&&"ontouchend" in document);
const mapsURL=e=>{const c=ll(e);return mapFlavor()==="apple"?`https://maps.apple.com/?daddr=${c.lat},${c.lng}&dirflg=w`:`https://www.google.com/maps/dir/?api=1&destination=${c.lat}%2C${c.lng}&travelmode=walking`};

/* Plan stylisé : la Seine, les étapes insolites en rouge numérotées, les monuments en gris */
const SEINE=[[48.8398,2.3740],[48.8447,2.3664],[48.8480,2.3628],[48.8502,2.3590],[48.8506,2.3545],[48.8515,2.3494],[48.8530,2.3470],[48.8541,2.3449],[48.8566,2.3413],[48.8585,2.3375],[48.8598,2.3330],[48.8615,2.3290],[48.8626,2.3236],[48.8641,2.3190]];
function mapSVG(r,o={}){
  const w=400,h=o.h||330,pad=34,K=Math.cos(48.855*Math.PI/180);
  const pts=[...r.ins,...r.std].map(ll);
  const xs=pts.map(p=>p.lng*K),ys=pts.map(p=>p.lat);
  const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
  const s=Math.min((w-2*pad)/((maxX-minX)||1e-4),(h-2*pad)/((maxY-minY)||1e-4));
  const ox=pad+((w-2*pad)-(maxX-minX)*s)/2,oy=pad+((h-2*pad)-(maxY-minY)*s)/2;
  const P=p=>[ox+(p.lng*K-minX)*s,oy+(maxY-p.lat)*s];
  const f=n=>n.toFixed(1),seine=SEINE.map(([a,b])=>P({lat:a,lng:b}).map(f).join(",")).join(" ");
  const pos=[];r.ins.forEach(e=>{let [x,y]=P(ll(e));if(pos.some(([a,b])=>Math.hypot(a-x,b-y)<24)){x+=22;y+=10}pos.push([x,y])});
  let lines="";
  for(let i=0;i<r.ins.length-1;i++){const [x1,y1]=pos[i],[x2,y2]=pos[i+1];const metro=legOf(r,r.ins[i].id,r.ins[i+1].id);
    lines+=metro?`<line x1="${f(x1)}" y1="${f(y1)}" x2="${f(x2)}" y2="${f(y2)}" stroke="var(--plaque)" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="1 8"/>`
               :`<line x1="${f(x1)}" y1="${f(y1)}" x2="${f(x2)}" y2="${f(y2)}" stroke="var(--route)" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 5" opacity=".75"/>`}
  /* étiquettes des monuments : on choisit la position qui chevauche le moins les pastilles et les autres étiquettes */
  const boxes=pos.map(([x,y])=>[x-15,y-15,x+15,y+15]);
  const ov=(a,b)=>Math.max(0,Math.min(a[2],b[2])-Math.max(a[0],b[0]))*Math.max(0,Math.min(a[3],b[3])-Math.max(a[1],b[1]));
  const grey=r.std.map(e=>{const [x,y]=P(ll(e)),name=shortName(e.titre),tw=[...name].reduce((s,ch)=>s+(/[\u2e80-\u9fff\u0600-\u06ff]/.test(ch)?(/[\u0600-\u06ff]/.test(ch)?6.4:13):5.6),0);let lab="";
    if(o.labels){const cand=[[x+10,y+4,"start"],[x-10,y+4,"end"],[x+8,y-9,"start"],[x+8,y+17,"start"],[x-8,y-9,"end"],[x-8,y+17,"end"]].map(([tx,ty,an])=>{
        const bx=an==="start"?[tx,ty-11,tx+tw,ty+3]:[tx-tw,ty-11,tx,ty+3];
        const out=(bx[0]<4||bx[2]>w-4||bx[1]<4||bx[3]>h-4)?5000:0;
        return {tx,ty,an,bx,score:out+boxes.reduce((s,b)=>s+ov(bx,b),0)}}).sort((a,b)=>a.score-b.score)[0];
      boxes.push(cand.bx);
      lab=`<text x="${f(cand.tx)}" y="${f(cand.ty)}" text-anchor="${cand.an}" font-family="Cormorant Garamond,Georgia,serif" font-style="italic" font-size="13" fill="var(--muted)">${esc(name)}</text>`}
    return `<g><circle cx="${f(x)}" cy="${f(y)}" r="5.5" fill="var(--grey)" stroke="var(--card)" stroke-width="2"><title>${esc(e.titre)}</title></circle>${lab}</g>`}).join("");
  const red=r.ins.map((e,i)=>{const [x,y]=pos[i];return `<g><circle cx="${f(x)}" cy="${f(y)}" r="13" fill="var(--red)" stroke="var(--card)" stroke-width="2.5"><title>${esc(e.titre)}</title></circle><text x="${f(x)}" y="${f(y+4.5)}" text-anchor="middle" font-family="Jost,sans-serif" font-size="12.5" font-weight="500" fill="#fff">${i+1}</text></g>`}).join("");
  return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(r.titre)}"><rect width="${w}" height="${h}" fill="var(--card)"/>
    <polyline points="${seine}" fill="none" stroke="var(--river)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="${w-16}" y="${h-14}" text-anchor="end" font-family="Cormorant Garamond,Georgia,serif" font-style="italic" font-size="15" fill="var(--muted)">la Seine</text>
    ${lines}${grey}${red}</svg>`;
}
function shortName(s){return cap(String(s).replace(/^(Le |La |Les |L’|L'|The |El |Los |Las |Il |Lo |I |Gli |Das |Der |Die |O |A |Os |As )/,"").replace(/ et le pont des Arts| and the Pont des Arts| y el puente de las Artes| e il pont des Arts| und der Pont des Arts| e o pont des Arts|和艺术桥| وجسر الفنون/,""))}

const durShort=r=>r.duree.min===r.duree.max?fmtH(r.duree.min,state.lang):`${fmtH(r.duree.min,state.lang)}–${fmtH(r.duree.max,state.lang)}`;

/* ---------- Voix (synthèse vocale de l’appareil : coût nul, hors ligne) ---------- */
const hasSpeech="speechSynthesis" in window;
function voiceFor(lang){if(!hasSpeech)return null;const vs=speechSynthesis.getVoices()||[],norm=s=>(s||"").toLowerCase().replace("_","-"),want=norm(LOCALES[lang]);
  return vs.find(v=>norm(v.lang)===want)||vs.find(v=>norm(v.lang).startsWith(lang))||null}

/* Lecture des étapes : fichier audio s’il existe (ElevenLabs, étape G), sinon voix de synthèse */
const audio={status:"idle",token:0,parts:[],at:0,el:null};
function stopAudio(){audio.token++;if(audio.el){audio.el.pause();audio.el=null}if(hasSpeech&&audio.status!=="idle")speechSynthesis.cancel();audio.status="idle";audio.at=0}
function speakFrom(k){
  const my=++audio.token;speechSynthesis.cancel();
  if(k>=audio.parts.length){audio.status="idle";audio.at=0;renderPlayer();return}
  audio.at=k;const u=new SpeechSynthesisUtterance(audio.parts[k]);u.lang=LOCALES[state.lang];const v=voiceFor(state.lang);if(v)u.voice=v;u.rate=state.rate;
  u.onend=()=>{if(my===audio.token)speakFrom(k+1)};
  speechSynthesis.speak(u);audio.status="playing";renderPlayer();
}
function curPlayable(){return state.screen==="mon"?cur().byId[state.mon]:stopAt(state.idx)}
function togglePlay(){
  const e=curPlayable();
  if(e.audio){
    if(!audio.el){audio.el=new Audio(e.audio);audio.el.playbackRate=state.rate;audio.el.onended=()=>{audio.status="idle";audio.el=null;renderPlayer()}}
    if(audio.status==="playing"){audio.el.pause();audio.status="paused"}else{audio.el.play();audio.status="playing"}
    renderPlayer();return}
  if(!hasSpeech)return;
  if(audio.status==="playing"){speechSynthesis.pause();audio.status="paused"}
  else if(audio.status==="paused"){speechSynthesis.resume();audio.status="playing"}
  else{const txt=(e.texte_long||e.texte_court||"").replace(VERIF,"");
    audio.parts=[e.titre+".",...(e.accroche?[e.accroche]:[]),...paras(txt).join(" ").split(/(?<=[.!?؟])\s+|(?<=[。！？])/)];speakFrom(0);return}
  renderPlayer();
}
function cycleRate(){const rates=[0.9,1,1.15];state.rate=rates[(rates.indexOf(state.rate)+1)%rates.length];
  if(audio.el){audio.el.playbackRate=state.rate;renderPlayer()}else if(audio.status==="playing")speakFrom(audio.at);else renderPlayer()}

function renderPlayer(){
  const slot=document.getElementById("player-slot");
  const show=state.screen==="place"||state.screen==="mon";
  document.body.classList.toggle("has-player",show);
  if(!show){slot.innerHTML="";return}
  const e=curPlayable(),canPlay=!!e.audio||hasSpeech;
  const st=!canPlay?t("noSpeech"):audio.status==="playing"?t("playing"):audio.status==="paused"?t("paused"):e.audio?t("listen"):t("ttsNote");
  slot.innerHTML=`<div class="player"><div class="player-in">
    <button class="play" data-action="play" aria-label="${audio.status==="playing"?t("paused"):t("listen")}"${canPlay?"":" disabled"}>${audio.status==="playing"?I.pause:I.play}</button>
    <div class="ptext"><b>${audio.status==="playing"?`<span class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i></span>`:""}${esc(e.titre)}</b><span>${st}</span></div>
    <button class="speed" data-action="rate" aria-label="Vitesse">${state.rate.toLocaleString(NUMLOC())}×</button>
  </div></div>`;
}
function toast(msg){const el=document.createElement("div");el.className="toast";el.setAttribute("role","status");el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),1800)}
async function copyText(s,msg){try{await navigator.clipboard.writeText(s)}catch(e){const ta=document.createElement("textarea");ta.value=s;document.body.appendChild(ta);ta.select();try{document.execCommand("copy")}catch(_){}ta.remove()}toast(msg||t("copied"))}

/* ---------- Guide vocal rue par rue ----------
   Itinéraire piéton : service OSRM « routed-foot » de FOSSGIS (données OpenStreetMap).
   Position : GPS du téléphone, ou marche simulée pour tester à distance. */
const OSRM="https://routing.openstreetmap.de/routed-foot/route/v1/foot/";
const SIM_SPEED=(()=>{try{return +new URLSearchParams(location.search).get("simspeed")||4}catch(e){return 4}})();
const G={on:false,sim:false,seq:0,unlocked:false,watch:null,simTimer:null,metroTimer:null,wake:null};
const K0=Math.cos(48.855*Math.PI/180);
const toXY=(lat,lng)=>[lng*K0*111320,lat*110574];
const nav=()=>NAV[state.lang]||NAV.fr;
function bearing(a,b){const r=Math.PI/180,y=Math.sin((b.lng-a.lng)*r)*Math.cos(b.lat*r),x=Math.cos(a.lat*r)*Math.sin(b.lat*r)-Math.sin(a.lat*r)*Math.cos(b.lat*r)*Math.cos((b.lng-a.lng)*r);return (Math.atan2(y,x)/r+360)%360}
function modFromTurn(before,after){const d=((after-before+540)%360)-180,a=Math.abs(d),s=d>0?"right":"left";
  if(a<20)return "straight";if(a<60)return "slight "+s;if(a<135)return s;if(a<170)return "sharp "+s;return "uturn"}
const dirOf=b=>nav().dirs[Math.round((((b||0)%360)+360)%360/45)%8];
const roundSay=m=>m<100?Math.max(10,Math.round(m/10)*10):Math.round(m/50)*50;
function sayDist(m){const N=nav();return m<1000?N.m(roundSay(m)):N.km((Math.round(m/100)/10).toLocaleString(NUMLOC()))}
function fmtDist(m){return m<1000?`${m<100?Math.max(5,Math.round(m/5)*5):Math.round(m/10)*10} m`:`${(Math.round(m/100)/10).toLocaleString(NUMLOC())} km`}

/* Nettoyage des étapes OSRM : on retire les « tout droit » inutiles et on fusionne les virages collés */
function buildSteps(raw){
  const quiet=new Set(["new name","continue","notification","use lane","suppressed","exit roundabout","exit rotary"]),res=[];
  for(const r of raw){const m=r.maneuver,s={type:m.type,mod:m.modifier||"straight",name:r.name||"",dist:r.distance||0,lat:m.location[1],lng:m.location[0],bb:m.bearing_before||0,ba:m.bearing_after||0,exit:m.exit};
    const last=res[res.length-1];
    if(last&&s.type!=="arrive"&&quiet.has(s.type)&&(s.mod==="straight"||s.type.startsWith("exit"))){last.dist+=s.dist;continue}
    if(last&&last.type!=="depart"&&s.type!=="arrive"&&last.dist<3){
      last.mod=modFromTurn(last.bb,s.ba);last.ba=s.ba;last.dist+=s.dist;last.name=s.name||last.name;last.exit=s.exit;last.type=s.exit?s.type:"turn";
      if(last.mod==="straight"&&!last.exit){res.pop();const prev=res[res.length-1];if(prev)prev.dist+=last.dist}
      continue}
    res.push(s)}
  return res}
function makeRoute(coords,steps,fallback){
  const cum=[0];for(let i=1;i<coords.length;i++)cum.push(cum[i-1]+dist({lat:coords[i-1][0],lng:coords[i-1][1]},{lat:coords[i][0],lng:coords[i][1]}));
  const len=cum[cum.length-1];let j=0;
  steps.forEach(s=>{let best=j,bd=Infinity;
    for(let i=j;i<coords.length;i++){const d=Math.abs(coords[i][0]-s.lat)+Math.abs(coords[i][1]-s.lng);if(d<bd){bd=d;best=i;if(d<1e-6)break}}
    j=best;s.along=cum[best]});
  const last=steps[steps.length-1];if(last&&last.type==="arrive")last.along=len;
  return {coords,cum,len,steps,fallback}}
async function fetchRoute(o,tg){
  const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),9000);
  try{
    const res=await fetch(`${OSRM}${o.lng.toFixed(6)},${o.lat.toFixed(6)};${tg.lng.toFixed(6)},${tg.lat.toFixed(6)}?overview=full&geometries=geojson&steps=true`,{signal:ctl.signal});
    if(!res.ok)throw new Error("HTTP "+res.status);
    const d=await res.json();if(d.code!=="Ok"||!d.routes||!d.routes[0])throw new Error(d.code);
    const rt=d.routes[0],coords=rt.geometry.coordinates.map(c=>[c[1],c[0]]);
    if(coords.length<2)throw new Error("geometry");
    return makeRoute(coords,buildSteps(rt.legs[0].steps),false)}
  catch(e){const d=dist(o,tg);/* repli : ligne droite */
    return makeRoute([[o.lat,o.lng],[tg.lat,tg.lng]],[{type:"depart",mod:"straight",name:"",dist:d,lat:o.lat,lng:o.lng,bb:0,ba:bearing(o,tg)},{type:"arrive",mod:"straight",name:"",dist:0,lat:tg.lat,lng:tg.lng,bb:0,ba:0}],true)}
  finally{clearTimeout(tm)}}
function snap(R,p){const P=toXY(p.lat,p.lng),from=G.lastAlong||0;let best=null;
  for(let i=0;i<R.coords.length-1;i++){
    if(R.cum[i+1]<from-40)continue;
    const A=toXY(R.coords[i][0],R.coords[i][1]),B=toXY(R.coords[i+1][0],R.coords[i+1][1]),dx=B[0]-A[0],dy=B[1]-A[1],L2=dx*dx+dy*dy;
    let u=L2?((P[0]-A[0])*dx+(P[1]-A[1])*dy)/L2:0;u=Math.max(0,Math.min(1,u));
    const d=Math.hypot(P[0]-(A[0]+u*dx),P[1]-(A[1]+u*dy));
    if(!best||d<best.off)best={off:d,along:R.cum[i]+u*(R.cum[i+1]-R.cum[i])}}
  return best||{off:Infinity,along:0}}
function pointAt(R,s){
  for(let i=1;i<R.coords.length;i++){if(R.cum[i]>=s){const f=(s-R.cum[i-1])/((R.cum[i]-R.cum[i-1])||1),a=R.coords[i-1],b=R.coords[i];return {lat:a[0]+f*(b[0]-a[0]),lng:a[1]+f*(b[1]-a[1])}}}
  const c=R.coords[R.coords.length-1];return {lat:c[0],lng:c[1]}}

/* Textes des instructions */
function targetTitle(){if(G.kind==="station")return t("stationSpoken",G.leg.montee.nom);return stopAt(state.idx).titre}
function stepAct(s){const N=nav();if(s.type==="depart")return N.depart(dirOf(s.ba),"");if(/roundabout|rotary/.test(s.type)&&s.exit)return N.round(s.exit);return N.mods[s.mod]||N.mods.straight}
function stepSay(s){const N=nav();
  if(s.type==="depart")return G.route&&G.route.fallback?N.crow(sayDist(G.route.len),dirOf(s.ba)):N.depart(dirOf(s.ba),s.name);
  return stepAct(s)+(s.name?N.onto(s.name):"")}
function stepIcon(s){if(s.type==="arrive")return I.pin;if(/roundabout|rotary/.test(s.type))return I.round;if(s.mod==="uturn")return I.uturn;return I.arrow(TURN_ANGLE[s.mod]||0)}

/* Parole du guide : les annonces se mettent en file d’attente */
function unlockSpeech(){if(hasSpeech&&!G.unlocked){try{const u=new SpeechSynthesisUtterance(" ");u.volume=0;speechSynthesis.speak(u);G.unlocked=true}catch(e){}}}
function say(text,opts={}){G.lastSaid=text;
  if(!hasSpeech||(!state.voice&&!opts.force)){if(opts.onend)setTimeout(opts.onend,700);return}
  const u=new SpeechSynthesisUtterance(text);u.lang=LOCALES[state.lang];const v=voiceFor(state.lang);if(v)u.voice=v;
  if(opts.onend){let done=false;const fin=()=>{if(!done){done=true;opts.onend()}};u.onend=fin;u.onerror=fin;setTimeout(fin,2500+text.length*80)}
  speechSynthesis.speak(u)}
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
function wakeOn(){try{if("wakeLock" in navigator&&!G.wake)navigator.wakeLock.request("screen").then(l=>{G.wake=l;l.addEventListener("release",()=>{G.wake=null})}).catch(()=>{})}catch(e){}}
function wakeOff(){try{G.wake&&G.wake.release()}catch(e){}G.wake=null}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&G.on)wakeOn()});

/* Cycle de guidage d’une étape */
function setTarget(){const p=stopAt(state.idx);
  if(G.phase==="toStation"){G.kind="station";G.target={lat:G.leg.montee.lat,lng:G.leg.montee.lng}}
  else{G.kind="place";G.target={...ll(p)}}}
function simOrigin(){const r=cur(),i=state.idx;
  if(G.phase==="fromStation"||G.phase==="metro")return G.leg.descente;
  return i>0?ll(r.ins[i-1]):r.depart.coordonnees}
function stopTracking(){if(G.watch!=null&&navigator.geolocation)navigator.geolocation.clearWatch(G.watch);G.watch=null;clearInterval(G.simTimer);G.simTimer=null}
function stopGuide(){if(hasSpeech&&G.on&&!G.arrived&&audio.status==="idle")speechSynthesis.cancel();stopTracking();clearTimeout(G.metroTimer);G.on=false;G.seq++;wakeOff()}
function startGuide(){stopGuide();
  const r=cur(),i=state.idx,prev=i>0?r.ins[i-1]:null,lg=prev?legOf(r,prev.id,r.ins[i].id):null;
  Object.assign(G,{on:true,leg:lg&&lg.type==="metro"?lg:null,route:null,pos:null,arrived:false,computing:false,info:null,adv:new Set(),now:new Set(),off:0,lastAlong:0,lastRoute:0,startOff:0,lastSaid:""});
  G.phase=G.leg?"toStation":"walk";G.status=G.sim?"computing":"locating";setTarget();
  state.screen="guide";wakeOn();render();
  if(G.sim)startSim(simOrigin());else startWatch()}
function startWatch(){stopTracking();
  if(!("geolocation" in navigator)){G.status="nogps";updateGuideUI();return}
  G.watch=navigator.geolocation.watchPosition(onFix,onGeoErr,{enableHighAccuracy:true,maximumAge:3000,timeout:30000})}
function onFix(e){if(!G.on||G.sim)return;const p={lat:e.coords.latitude,lng:e.coords.longitude,acc:e.coords.accuracy||0};
  if(G.phase==="metro"||G.route||G.computing){navTick(p);return}
  G.pos=p;if(dist(p,G.target)>15000){G.status="far";updateGuideUI();return}
  computeRoute(p,true)}
function onGeoErr(e){if(!G.on||G.sim)return;if(e.code===1)G.status="denied";else if(e.code===2)G.status="nogps";else return;updateGuideUI()}
async function startSim(o){stopTracking();G.pos={lat:o.lat,lng:o.lng,acc:5};G.status="computing";updateGuideUI();
  await computeRoute(G.pos,true);if(!G.on||!G.sim||!G.route)return;
  const R=G.route;let s=0;
  G.simTimer=setInterval(()=>{if(!G.on||G.route!==R){clearInterval(G.simTimer);return}
    s=Math.min(R.len,s+1.4*SIM_SPEED*0.5);navTick({...pointAt(R,s),acc:5})},500)}
async function computeRoute(o,intro){const my=++G.seq;G.computing=true;if(!G.route)G.status="computing";updateGuideUI();
  const R=await fetchRoute(o,G.target);
  if(my!==G.seq||!G.on)return;
  Object.assign(G,{computing:false,route:R,adv:new Set(),now:new Set(),lastAlong:0,off:0,lastRoute:Date.now(),info:null,status:R.fallback?"offline":"ok"});
  G.startOff=snap(R,o).off;
  drawGuideMap();
  const N=nav();let txt="";
  if(intro)txt+=t("routeIntro",targetTitle(),sayDist(R.len),Math.max(1,Math.round(R.len/75)))+" ";
  txt+=cap(stepSay(R.steps[0]))+".";
  const s1=R.steps[1];
  if(s1&&s1.type!=="arrive"&&s1.along>12&&s1.along<=50){txt+=" "+cap(`${N.in(sayDist(s1.along))}, ${stepSay(s1)}`)+".";G.adv.add(1)}
  say(txt);
  navTick(G.pos||o)}
function navTick(p){if(!G.on)return;G.pos=p;
  if(G.phase==="metro"){if(!G.sim&&dist(p,G.leg.descente)<150)leaveMetro();return}
  const R=G.route;if(!R||G.arrived||G.computing){updateGuideUI();return}
  const sn=snap(R,p);if(sn.along>30)G.startOff=0;
  const tol=Math.max(30,Math.min(60,(p.acc||0)*1.2),G.startOff+15),isOff=sn.off>tol;
  if(isOff){G.off++;if(G.off>=2&&Date.now()-G.lastRoute>(R.fallback?45000:12000)){if(!R.fallback)say(t("rerouting"));computeRoute(p,false);return}}
  else{G.off=0;G.lastAlong=Math.max(G.lastAlong,sn.along)}
  const along=isOff?G.lastAlong:sn.along,remain=Math.max(0,R.len-along);
  if(remain<=15||dist(p,G.target)<=18){arrive();return}
  const N=nav();let k=R.steps.findIndex((s,i)=>i>0&&s.along>along+2);if(k<0)k=R.steps.length-1;
  const s=R.steps[k],d=Math.max(0,s.along-along),gap=s.along-R.steps[k-1].along;
  if(s.type==="arrive"){if(!G.adv.has(k)&&d<=50&&d>20&&gap>=40){G.adv.add(k);say(cap(`${N.in(sayDist(d))}, ${N.arriveSoon}`)+".")}}
  else{
    if(!G.adv.has(k)&&d<=50&&d>15&&gap>=30){G.adv.add(k);say(cap(`${N.in(sayDist(d))}, ${stepSay(s)}`)+".")}
    if(!G.now.has(k)&&d<=12){G.now.add(k);G.adv.add(k);let txt=cap(stepSay(s));
      /* virages rapprochés (traversées en zigzag) : annoncés d’une traite */
      for(let j=k+1;j<=k+2;j++){const a=R.steps[j-1],b=R.steps[j];if(!b||b.type==="arrive"||b.along-a.along>=15)break;
        txt+=`, ${N.then} ${stepSay(b)}`;G.adv.add(j);G.now.add(j)}
      say(txt+".");buzz(60)}}
  G.info={k,d,remain};updateGuideUI()}
function arrive(){if(G.arrived||!G.on)return;G.arrived=true;G.seq++;G.computing=false;stopTracking();buzz([90,60,90]);
  if(G.phase==="toStation"){enterMetro();return}
  G.status="arrived";G.info=null;updateGuideUI();
  say(t("arrived",targetTitle()),{onend:()=>{if(G.on&&state.screen==="guide"){state.autoplay=true;go("place")}}})}
function enterMetro(){const lg=G.leg;Object.assign(G,{phase:"metro",kind:"metro",route:null,info:null,arrived:false,status:"metro"});render();
  say(t("arrived",t("stationSpoken",lg.montee.nom))+" "+t("metroSay",lg.ligne,lg.direction,lg.descente.nom,lg.arrets),
    {onend:()=>{if(G.on&&G.sim&&G.phase==="metro")G.metroTimer=setTimeout(leaveMetro,3000)}});
  if(!G.sim)startWatch()}
function leaveMetro(){if(!G.on||G.phase!=="metro")return;clearTimeout(G.metroTimer);
  Object.assign(G,{phase:"fromStation",route:null,info:null,arrived:false,status:"computing"});setTarget();render();
  if(G.sim)startSim(G.leg.descente);else if(G.pos)computeRoute(G.pos,true);else G.status="locating"}
function toggleSim(){G.sim=!G.sim;stopTracking();clearTimeout(G.metroTimer);G.seq++;
  Object.assign(G,{route:null,computing:false,arrived:false,info:null,lastAlong:0});
  if(G.phase==="metro"){render();if(G.sim)G.metroTimer=setTimeout(leaveMetro,3000);else startWatch();return}
  G.status=G.sim?"computing":"locating";render();
  if(G.sim)startSim(simOrigin());else startWatch()}
function repeatInstr(){const N=nav();
  if(G.phase==="metro"){const lg=G.leg;say(t("metroSay",lg.ligne,lg.direction,lg.descente.nom,lg.arrets),{force:true});return}
  const R=G.route,i=G.info;
  if(R&&i){const s=R.steps[i.k];say(cap(`${N.in(sayDist(i.d))}, ${s.type==="arrive"?N.arriveSoon:stepSay(s)}`)+".",{force:true});return}
  if(G.lastSaid)say(G.lastSaid,{force:true})}

/* Affichage du guidage */
function updateGuideUI(){if(state.screen!=="guide")return;const $=id=>document.getElementById(id),ico=$("g-ico");if(!ico)return;
  let icon=I.locate,d="",instr="",name="",then="",remain="–",time="–";
  if(G.phase==="metro"&&G.leg){const lg=G.leg;icon=I.metro;d=`${t("line")} ${lg.ligne}`;instr=`${t("direction")} ${lg.direction}`;name=t("alightAt",lg.descente.nom,lg.arrets)}
  else if(G.status==="arrived"){icon=I.pin;instr=t("arrivedShort");name=G.kind==="station"?G.leg.montee.nom:targetTitle()}
  else if(G.route&&G.info){const R=G.route,s=R.steps[G.info.k];icon=stepIcon(s);d=fmtDist(G.info.d);
    if(s.type==="arrive"){instr=G.kind==="station"?G.leg.montee.nom:targetTitle();name=t("destination")}
    else{instr=cap(stepAct(s));name=s.name}
    const n2=R.steps[G.info.k+1];if(n2&&n2.type!=="arrive")then=t("thenLine",stepAct(n2)+(n2.name?` · ${n2.name}`:""));
    remain=fmtDist(G.info.remain);time=minTxt(Math.max(1,Math.round(G.info.remain/75)))}
  else instr=G.status==="far"?t("farShort"):(G.status==="denied"||G.status==="nogps")?t("noLoc"):G.status==="computing"?t("computing"):t("locating");
  ico.innerHTML=icon;$("g-dist").textContent=d;$("g-instr").textContent=instr;$("g-name").textContent=name;$("g-then").textContent=then;
  if($("g-remain")){$("g-remain").textContent=remain;$("g-time").textContent=time}
  let msg="";
  if(G.status==="far")msg=t("far");else if(G.status==="denied")msg=t("gpsDenied");else if(G.status==="nogps")msg=t("gpsNone");
  else if(G.status==="offline")msg=t("offline");else if(G.sim)msg=t("simOn");
  else if(G.pos&&G.pos.acc>50)msg=t("weak");else if(G.route&&!("wakeLock" in navigator))msg=t("keepOn");
  $("g-status").textContent=msg;
  updateDot()}
function drawGuideMapSVG(){const el=document.getElementById("g-map");if(!el)return;const R=G.route;
  if(!R||G.phase==="metro"){el.innerHTML="";G.proj=null;return}
  const w=400,h=260,pad=26,pts=R.coords.map(c=>toXY(c[0],c[1])),xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);
  const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
  const s=Math.min((w-2*pad)/((maxX-minX)||1),(h-2*pad)/((maxY-minY)||1));
  const ox=pad+((w-2*pad)-(maxX-minX)*s)/2,oy=pad+((h-2*pad)-(maxY-minY)*s)/2;
  const P=(lat,lng)=>{const [x,y]=toXY(lat,lng);return [ox+(x-minX)*s,oy+(maxY-y)*s]};G.proj=P;
  const f=n=>n.toFixed(1),line=R.coords.map(c=>P(c[0],c[1]).map(f).join(",")).join(" ");
  const turns=R.steps.slice(1,-1).map(st=>{const [x,y]=P(st.lat,st.lng);return `<circle cx="${f(x)}" cy="${f(y)}" r="3.2" fill="var(--surface)" stroke="var(--gline)" stroke-width="1.6"/>`}).join("");
  const [tx,ty]=P(G.target.lat,G.target.lng);
  el.innerHTML=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${t("mapAria")}">
    <polyline points="${line}" fill="none" stroke="var(--gline)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"${R.fallback?' stroke-dasharray="2 9"':""}/>${turns}
    <circle cx="${f(tx)}" cy="${f(ty)}" r="12" fill="${G.kind==="station"?"var(--plaque)":"var(--red)"}" stroke="var(--surface)" stroke-width="2"/>
    <text x="${f(tx)}" y="${f(ty+4.5)}" text-anchor="middle" font-family="Jost,sans-serif" font-size="12" font-weight="500" fill="#fff">${G.kind==="station"?"M":state.idx+1}</text>
    <circle id="g-me" cx="-20" cy="-20" r="8" fill="var(--ink)" stroke="var(--surface)" stroke-width="3"/></svg>`}
function updateDotSVG(){const me=document.getElementById("g-me");if(!me||!G.proj||!G.pos)return;
  let [x,y]=G.proj(G.pos.lat,G.pos.lng);x=Math.max(8,Math.min(392,x));y=Math.max(8,Math.min(252,y));
  me.setAttribute("cx",x.toFixed(1));me.setAttribute("cy",y.toFixed(1))}

function styleFor(base,flavor,dark,lang){
  const P=PAL[flavor][dark?"dark":"light"],s=JSON.parse(JSON.stringify(base));
  s.layers=s.layers.filter(l=>!/^(natural_earth|boundary_|highway-shield|road_shield|road_one_way|aeroway|airport|label_country|label_state)/.test(l.id));
  const paint=(l,k,v)=>{(l.paint=l.paint||{})[k]=v},layout=(l,k,v)=>{(l.layout=l.layout||{})[k]=v};
  const cls=id=>/motorway/.test(id)?"mw":/trunk_primary/.test(id)?"pri":/secondary_tertiary/.test(id)?"sec":/path_pedestrian/.test(id)?"path":/rail/.test(id)?"rail":"min";
  for(const l of s.layers){const id=l.id;
    if(id==="background")paint(l,"background-color",P.land);
    else if(id==="park"){paint(l,"fill-color",P.park);paint(l,"fill-opacity",1)}
    else if(id==="park_outline")layout(l,"visibility","none");
    else if(id==="landuse_residential"){paint(l,"fill-color",P.resid);paint(l,"fill-opacity",1)}
    else if(/^(landcover_(wood|grass|wetland)|landuse_(pitch|track|cemetery))$/.test(id)){paint(l,"fill-color",/wood/.test(id)?P.wood:P.park);paint(l,"fill-opacity",.95)}
    else if(id==="landuse_hospital")paint(l,"fill-color",P.hosp);
    else if(id==="landuse_school")paint(l,"fill-color",P.school);
    else if(id==="landcover_sand")paint(l,"fill-color",P.sand);
    else if(id==="water")paint(l,"fill-color",P.water);
    else if(/^waterway/.test(id)&&l.type==="line")paint(l,"line-color",P.water);
    else if(id==="building"){paint(l,"fill-color",P.bld);paint(l,"fill-outline-color",P.bldLine)}
    else if(id==="building-3d"){paint(l,"fill-extrusion-color",P.bld3d);paint(l,"fill-extrusion-opacity",.85)}
    else if(id==="road_area_pattern")layout(l,"visibility","none");
    else if(l.type==="line"&&/^(road|tunnel|bridge)_/.test(id)){const c=cls(id),cas=/casing/.test(id);
      if(c==="rail"){paint(l,"line-color",P.rail);continue}
      paint(l,"line-color",P.road[c][cas?1:0]);if(/^tunnel/.test(id))paint(l,"line-opacity",.55)}
    else if(l.type==="symbol"){
      const water=/^water/.test(id),road=/^highway-name/.test(id),poi=/^poi/.test(id),place=/^label_/.test(id);
      if(poi&&P.fewPoi&&/^poi_r(20|7)$/.test(id))layout(l,"visibility","none");
      paint(l,"text-color",water?P.waterTxt:road?P.roadTxt:poi?P.poiTxt:P.txt);paint(l,"text-halo-color",P.halo);paint(l,"text-halo-width",1.4);
      if((place||poi||water)&&lang!=="ar")layout(l,"text-field",["coalesce",["get","name:"+lang],["get","name"]]);
    }}
  return s}

function loadMapLib(){if(MAPS.lib)return MAPS.lib;
  MAPS.lib=new Promise((res,rej)=>{if(window.maplibregl)return res(window.maplibregl);
    const k=document.createElement("link");k.rel="stylesheet";k.href=MAPLIB.css;document.head.appendChild(k);
    const s=document.createElement("script");s.src=MAPLIB.js;s.async=true;s.onload=()=>window.maplibregl?res(window.maplibregl):rej(new Error("maplibre"));s.onerror=()=>{MAPS.lib=null;rej(new Error("maplibre"))};document.head.appendChild(s)});
  return MAPS.lib}
function baseStyle(){if(!MAPS.style)MAPS.style=fetch(OFM_STYLE).then(r=>{if(!r.ok)throw new Error("style "+r.status);return r.json()}).catch(e=>{MAPS.style=null;throw e});return MAPS.style}
async function loadTrace(id){if(id in MAPS.traces)return MAPS.traces[id];const c=DB.catalog.parcours.find(p=>p.parcours_id===id);
  try{MAPS.traces[id]=c&&c.trace?await loadJSON(c.trace):null}catch(e){MAPS.traces[id]=null}return MAPS.traces[id]}
function destroyMaps(){for(const m of MAPS.list){try{m.map&&m.map.remove()}catch(e){}if(m.io)m.io.disconnect()}MAPS.list=[]}
const boundsOf=pts=>{let a=[180,90],b=[-180,-90];for(const [x,y] of pts){a=[Math.min(a[0],x),Math.min(a[1],y)];b=[Math.max(b[0],x),Math.max(b[1],y)]}return [a,b]};

async function createMap(wrap,o){
  if(!wrap||!hasWebGL())return null;
  const entry={el:wrap,kind:o.kind,ready:false};MAPS.list.push(entry);
  let gl,base;try{[gl,base]=await Promise.all([loadMapLib(),baseStyle()])}catch(e){return null}
  if(!MAPS.list.includes(entry)||!document.body.contains(wrap))return null;
  const flavor=mapFlavor(),dark=isDark(),coop=mt("coop");
  let map;
  try{map=new gl.Map({container:wrap.querySelector(".mapgl"),style:styleFor(base,flavor,dark,state.lang),bounds:boundsOf(o.points),fitBoundsOptions:{padding:o.padding||50},
    attributionControl:{compact:true},cooperativeGestures:!!o.coop,interactive:o.interactive!==false,pitch:o.pitch||0,maxZoom:18.5,minZoom:10,maxPitch:65,
    locale:{"CooperativeGesturesHandler.WindowsHelpText":coop[1],"CooperativeGesturesHandler.MacHelpText":coop[1],"CooperativeGesturesHandler.MobileHelpText":coop[0]}})}
  catch(e){return null}
  entry.map=map;entry.flavor=flavor;entry.P=PAL[flavor][dark?"dark":"light"];
  map.on("error",()=>{});
  const ok=await new Promise(res=>{map.once("load",()=>res(true));setTimeout(()=>res(false),15000)});
  if(!ok||!MAPS.list.includes(entry))return null;
  entry.ready=true;wrap.classList.add("live");
  return entry}
const firstSymbol=map=>{const l=map.getStyle().layers.find(x=>x.type==="symbol");return l&&l.id};

  el.setAttribute("aria-label",String(n));return el}
function mkMon(){const el=document.createElement("div");el.className="mk mk-m";return el}
function mkMe(color){const el=document.createElement("div");el.className="mk-me";el.style.setProperty("--me",color);return el}
function popupFor(e,kind,i){const p=firstPhoto(e),gl=window.maplibregl;
  const html=`<div class="pop">${p?`<img src="${esc(phURL(p,330))}" alt="" referrerpolicy="no-referrer">`:""}<div class="pop-b"><span class="pop-k">${kind==="ins"?`<span class="num sm">${i+1}</span>${esc(t("legendIns"))}`:`<span class="dot"></span>${esc(t("landmark"))}`}</span>
