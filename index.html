<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flânerie – Paris insolite</title>
<meta name="theme-color" content="#1F3A5F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECEEEF;--surface:#F8F9F9;--ink:#1D2630;--muted:#5B6570;--line:#CDD2D6;
  --plaque:#1F3A5F;--frame:#2D6A4F;--river:#CBD6DF;--route:#1D2630;
  --sans:"Jost",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11161B;--surface:#19212A;--ink:#E4E8EB;--muted:#9AA4AE;--line:#2C3843;
    --plaque:#24477A;--frame:#3B7F60;--river:#22313F;--route:#C9D2DA;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11161B;--surface:#19212A;--ink:#E4E8EB;--muted:#9AA4AE;--line:#2C3843;
  --plaque:#24477A;--frame:#3B7F60;--river:#22313F;--route:#C9D2DA;color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--plaque);outline-offset:3px;border-radius:4px}
.app{max-width:480px;margin:0 auto;padding:0 22px 140px}
.screen{animation:in .28s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen{animation:none}}

/* barre haute */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;min-height:56px;gap:12px}
.back{background:none;border:0;padding:10px 0;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:15px}
.back svg{width:18px;height:18px}
.lang{appearance:none;background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 30px 7px 14px;font-size:14px;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 16px) 52%,calc(100% - 11px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.lang option{color:#1D2630}

/* plaque de rue, l'élément signature */
.plaque{display:inline-block;background:var(--plaque);color:#fff;border:5px solid var(--frame);border-radius:12px;
  box-shadow:inset 0 0 0 3px var(--plaque),inset 0 0 0 5px rgba(255,255,255,.92);padding:14px 22px 16px;text-align:center}
.plaque .arr{display:block;font-size:13px;font-weight:400;opacity:.92;margin-bottom:2px}
.plaque .street{display:block;font-weight:500;font-size:22px;letter-spacing:.05em;text-transform:uppercase;line-height:1.15}
.plaque.hero .street{font-size:34px;letter-spacing:.07em}
.plaque.wide{display:block}

/* accueil */
.home-hero{padding:40px 0 8px}
.lede{font-family:var(--serif);font-size:20px;line-height:1.55;color:var(--muted);margin:22px 0 0;max-width:30ch}
.label{font-size:15px;font-weight:500;color:var(--muted);margin:40px 0 4px}
.choice{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;padding:18px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer}
.choice .name{font-size:27px;font-weight:300;line-height:1.15}
.choice .desc{display:block;font-family:var(--serif);font-size:16px;color:var(--muted);margin-top:4px}
.choice .soon{font-size:13px;color:var(--muted);white-space:nowrap}
.choice[disabled]{cursor:default}
.choice[disabled] .name{color:var(--muted)}
.choice .chev{width:18px;height:18px;flex:none;color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin-top:36px}

/* titres */
h1{font-weight:400;font-size:32px;line-height:1.12;letter-spacing:-.01em;margin:18px 0 8px}
.sub{color:var(--muted);font-size:15px;margin:0}
.fallback{font-size:14px;color:var(--muted);background:var(--surface);border-radius:10px;padding:10px 14px;margin:14px 0 0}

/* filtres */
.filters{display:flex;gap:8px;margin:22px 0 6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 16px;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* liste des parcours */
.route{display:grid;grid-template-columns:84px 1fr;gap:16px;align-items:center;width:100%;padding:18px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer}
.thumb{width:84px;height:84px;border-radius:10px;background:var(--surface);overflow:hidden}
.thumb svg{display:block;width:100%;height:100%}
.route .title{font-size:21px;font-weight:400;line-height:1.2}
.route .facts{font-size:14px;color:var(--muted);margin-top:6px;line-height:1.5}

/* détail parcours */
.map{background:var(--surface);border-radius:14px;overflow:hidden;margin-top:20px}
.map svg{display:block;width:100%;height:auto}
.caption{font-size:13px;color:var(--muted);margin:8px 2px 0}
.facts-row{display:flex;gap:28px;margin:22px 0 4px}
.fact b{display:block;font-weight:400;font-size:24px}
.fact span{font-size:13px;color:var(--muted)}
.intro{font-family:var(--serif);font-size:18px;line-height:1.6;margin:18px 0 0}
ol.stops{list-style:none;padding:0;margin:26px 0 0}
.stop{display:grid;grid-template-columns:30px 1fr;gap:14px;align-items:start}
.num{width:30px;height:30px;border-radius:50%;background:var(--plaque);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:500}
.stop button{background:none;border:0;padding:3px 0 0;text-align:left;cursor:pointer}
.stop .t{font-size:18px;line-height:1.25}
.stop .h{display:block;font-family:var(--serif);font-size:15px;color:var(--muted);margin-top:3px}
.leg{display:grid;grid-template-columns:30px 1fr;gap:14px;font-size:13px;color:var(--muted);margin:6px 0}
.leg i{justify-self:center;width:1px;min-height:26px;background:var(--line)}
.leg.metro i{width:3px;background:var(--plaque);border-radius:2px}
.leg span{align-self:center}

.primary{display:block;width:100%;margin-top:30px;background:var(--plaque);color:#fff;border:0;border-radius:999px;padding:16px 22px;font-size:16px;font-weight:500;cursor:pointer}
.secondary{display:block;width:100%;margin-top:12px;background:transparent;border:1px solid var(--line);border-radius:999px;padding:15px 22px;font-size:16px;cursor:pointer}

/* fiche lieu */
.progress{display:flex;gap:4px;margin:6px 0 22px}
.progress span{flex:1;height:3px;border-radius:2px;background:var(--line)}
.progress span.on{background:var(--plaque)}
.step-label{font-size:14px;color:var(--muted);margin:0 0 14px}
.hook{font-family:var(--serif);font-style:italic;font-size:21px;line-height:1.45;margin:20px 0 0}
.body{font-family:var(--serif);font-size:18px;line-height:1.68;margin:18px 0 0}
.body p{margin:0 0 1em}
.photo{margin:26px 0 0;border:1px dashed var(--line);border-radius:12px;padding:16px;font-size:14px;color:var(--muted)}
.photo b{display:block;color:var(--ink);font-weight:500;font-size:14px;margin-bottom:2px}
dl.practical{margin:28px 0 0;display:grid;grid-template-columns:92px 1fr;gap:10px 14px;font-size:15px}
dl.practical dt{color:var(--muted)}
dl.practical dd{margin:0}
.sources{font-size:14px;color:var(--muted);margin:24px 0 0}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:30px}
.nav button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:14px 10px;font-size:15px;cursor:pointer}
.nav button.next{background:var(--plaque);border-color:var(--plaque);color:#fff}
.nav button[disabled]{opacity:.35;cursor:default}

/* lecteur audio */
.player{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);padding:12px 22px calc(12px + env(safe-area-inset-bottom,0px))}
.player-in{max-width:436px;margin:0 auto;display:flex;align-items:center;gap:14px}
.play{flex:none;width:48px;height:48px;border-radius:50%;border:0;background:var(--plaque);color:#fff;display:grid;place-items:center;cursor:pointer}
.play svg{width:20px;height:20px}
.ptext{flex:1;min-width:0}
.ptext b{display:block;font-weight:400;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptext span{font-size:13px;color:var(--muted)}
.speed{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}

.done{text-align:center;padding-top:60px}
.done .lede{margin-left:auto;margin-right:auto}

/* guide vocal */
:root{--gline:#1F3A5F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--gline:#7FA3D6}}
:root[data-theme="dark"]{--gline:#7FA3D6}
.gcard{display:grid;grid-template-columns:52px 1fr;column-gap:16px;align-items:center;background:var(--plaque);color:#fff;border-radius:16px;padding:18px 20px;margin-top:20px;min-height:100px}
.g-ico{grid-row:1/span 3;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center}
.g-ico svg{width:28px;height:28px}
.g-dist{font-size:28px;font-weight:400;line-height:1.1}
.g-dist:empty,.g-name:empty{display:none}
.g-instr{font-size:18px;font-weight:500;line-height:1.3}
.g-name{font-size:15px;opacity:.86;line-height:1.35}
.g-then{font-size:14px;color:var(--muted);margin:10px 2px 0;min-height:1.45em}
.g-status{font-size:14px;line-height:1.45;background:var(--surface);border-radius:10px;padding:10px 14px;margin:14px 0 0}
.g-status:empty{display:none}
.g-map:empty{display:none}
.g-map{margin-top:16px}
.g-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}

/* CDC MLP : étapes insolites en rouge, monuments en gris, photos TASL, tarif, adresse */
:root{--red:#B42318;--grey:#8A939C}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--red:#E5645A;--grey:#7D8792}}
:root[data-theme="dark"]{--red:#E5645A;--grey:#7D8792}
.num{background:var(--red)}
.num.small{display:inline-grid;width:22px;height:22px;font-size:12px;margin-right:8px;vertical-align:middle}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--grey);margin-right:8px;vertical-align:middle}
.stop.std .dot{justify-self:center;margin:8px 0 0}
.stop.std .t{font-size:16px;color:var(--muted)}
.stop.std .h{font-size:14px}
.badge{display:inline-block;font-size:12px;font-weight:500;letter-spacing:.02em;border-radius:999px;padding:3px 10px;vertical-align:middle}
.badge.free{background:color-mix(in srgb,var(--frame) 16%,transparent);color:var(--frame)}
.badge.paid{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
.sub .badge{margin-left:8px}
.card{display:block;background:var(--surface);border-radius:16px;overflow:hidden;margin:14px 0 8px}
.card-map svg{display:block;width:100%;height:auto;max-height:210px}
.card-body{padding:16px 18px 4px}
.card-body h3{font-weight:400;font-size:24px;line-height:1.2;margin:10px 0 6px}
.card-facts{font-size:14px;color:var(--muted);margin:10px 0 0;line-height:1.5}
.card .primary{width:auto;margin:16px 18px 18px;padding:14px 34px}
.soon-list{font-family:var(--serif);font-size:17px;color:var(--muted);margin:4px 0 0;line-height:1.6}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:13px;color:var(--muted);margin:8px 2px 0}
.legend .lg{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:-8px}
.legend .lg.red{background:var(--red)}.legend .lg.grey{background:var(--grey)}
.photos{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:24px -22px 0;padding:0 22px 6px;scrollbar-width:thin}
.photos figure{flex:0 0 100%;scroll-snap-align:center;margin:0}
.photos.multi figure{flex-basis:88%}
.photos img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;background:var(--surface)}
.photos figcaption{font-size:12px;line-height:1.45;color:var(--muted);margin:8px 2px 0}
.photos figcaption a{color:inherit}
.photos .cand{display:block;margin-top:2px;font-style:italic}
.photos figure.broken{display:none}
mark.verif{background:color-mix(in srgb,#E0A100 22%,transparent);color:inherit;font-family:var(--sans);font-size:.72em;letter-spacing:.03em;text-transform:uppercase;padding:1px 6px;border-radius:4px;white-space:nowrap}
.info{display:flex;gap:12px;align-items:flex-start;margin:28px 0 0}
.info p{margin:1px 0 0;font-size:15px;line-height:1.5}
.info .badge{flex:none}
dl.practical{margin-top:18px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.secondary.small{display:inline-flex;align-items:center;gap:8px;width:auto;margin:0;padding:10px 16px;font-size:14px;text-decoration:none;color:var(--ink)}
.secondary.small svg{width:16px;height:16px}
.mon-card{display:grid;grid-template-columns:auto 1fr 18px;align-items:center;gap:4px;width:100%;margin-top:26px;padding:14px 16px;border:0;border-radius:12px;background:var(--surface);text-align:left;cursor:pointer}
.mon-card .k{display:block;font-size:13px;color:var(--muted)}
.mon-card .t{display:block;font-size:17px}
.mon-card .chev{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:20;background:var(--ink);color:var(--bg);font-size:14px;padding:10px 18px;border-radius:999px;box-shadow:0 4px 18px rgba(0,0,0,.18)}
</style>
</head>

function fmtH(min,lang){const h=Math.floor(min/60),m=min%60;if(min>=360)return {fr:"Une journée",en:"Full day",es:"Un día"}[lang];return m?`${h} h ${String(m).padStart(2,"0")}`:`${h} h`}

/* ---------- Contenu : catalogue + un fichier JSON par parcours et par langue (format du CDC) ---------- */
const DB={catalog:null,content:{}};
async function loadJSON(u){const r=await fetch(u,{cache:"no-cache"});if(!r.ok)throw new Error(u+" "+r.status);return r.json()}
async function loadLang(lang){
  if(DB.content[lang])return;
  const out={};
  await Promise.all(DB.catalog.parcours.filter(p=>p.langues.includes(lang)).map(async p=>{out[p.parcours_id]=prep(await loadJSON(p.fichier.replace("{langue}",lang)))}));
  DB.content[lang]=out;
}
function prep(r){r.ins=r.etapes.filter(e=>e.type==="insolite").sort((a,b)=>a.ordre-b.ordre);r.std=r.etapes.filter(e=>e.type==="standard");
  r.byId=Object.fromEntries(r.etapes.map(e=>[e.id,e]));return r}

  const n=(navigator.language||"fr").slice(0,2).toLowerCase();return I18N[n]?n:"fr"}

const state={lang:savedLang(),screen:"loading",route:null,idx:0,mon:null,back:"route",rate:1,guided:false,autoplay:false,voice:loadVoice()};

const L=o=>o==null?"":(typeof o==="object"&&!Array.isArray(o)?(o[state.lang]??o.fr):o);
const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const routeById=id=>(DB.content[state.lang]||DB.content.fr||{})[id]||(DB.content.fr||{})[id];

/* ---------- Géo ---------- */
function dist(a,b){const R=6371000,r=Math.PI/180,dLa=(b.lat-a.lat)*r,dLo=(b.lng-a.lng)*r;
  const h=Math.sin(dLa/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
const legOf=(r,a,b)=>(r.trajets||[]).find(l=>l.de===a&&l.vers===b);
const walkMinutes=(a,b)=>Math.max(2,Math.round(dist(ll(a),ll(b))*1.3/75));
const kmTxt=r=>(r.distance_km||0).toLocaleString(state.lang);

const SEINE=[[48.8420,2.3800],[48.8470,2.3700],[48.8505,2.3615],[48.8522,2.3560],[48.8535,2.3500],[48.8540,2.3460],[48.8555,2.3420],[48.8575,2.3380],[48.8595,2.3320],[48.8615,2.3260],[48.8645,2.3170]];
function mapSVG(r,big){
  const w=big?400:84,h=big?320:84,pad=big?30:12,K=Math.cos(48.855*Math.PI/180);
  const pts=[...r.ins,...(big?r.std:[])].map(ll);
  const xs=pts.map(p=>p.lng*K),ys=pts.map(p=>p.lat);
  const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
  const s=Math.min((w-2*pad)/((maxX-minX)||1e-4),(h-2*pad)/((maxY-minY)||1e-4));
  const ox=pad+((w-2*pad)-(maxX-minX)*s)/2,oy=pad+((h-2*pad)-(maxY-minY)*s)/2;
  const P=p=>[ox+(p.lng*K-minX)*s,oy+(maxY-p.lat)*s];
  const f=n=>n.toFixed(1),seine=SEINE.map(([a,b])=>P({lat:a,lng:b}).map(f).join(",")).join(" ");
  let lines="";
  for(let i=0;i<r.ins.length-1;i++){const [x1,y1]=P(ll(r.ins[i])),[x2,y2]=P(ll(r.ins[i+1]));const metro=legOf(r,r.ins[i].id,r.ins[i+1].id);
    lines+=metro?`<line x1="${f(x1)}" y1="${f(y1)}" x2="${f(x2)}" y2="${f(y2)}" stroke="var(--plaque)" stroke-width="${big?3.5:2}" stroke-linecap="round" stroke-dasharray="${big?"1 7":"1 4"}"/>`
               :`<line x1="${f(x1)}" y1="${f(y1)}" x2="${f(x2)}" y2="${f(y2)}" stroke="var(--route)" stroke-width="${big?1.6:1.2}" stroke-dasharray="${big?"5 4":"3 2"}" opacity=".7"/>`}
  const grey=big?r.std.map(e=>{const [x,y]=P(ll(e));return `<circle cx="${f(x)}" cy="${f(y)}" r="6" fill="var(--grey)" stroke="var(--surface)" stroke-width="2"><title>${esc(e.titre)}</title></circle>`}).join(""):"";
  /* deux étapes très proches (verger et rucher) : on décale la pastille pour qu'elles restent lisibles */
  const pos=[];r.ins.forEach(e=>{let [x,y]=P(ll(e));if(big&&pos.some(([a,b])=>Math.hypot(a-x,b-y)<22)){x+=20;y+=10}pos.push([x,y])});
  const red=r.ins.map((e,i)=>{const [x,y]=pos[i];return big
    ?`<g><circle cx="${f(x)}" cy="${f(y)}" r="12" fill="var(--red)" stroke="var(--surface)" stroke-width="2"/><text x="${f(x)}" y="${f(y+4.5)}" text-anchor="middle" font-family="Jost,sans-serif" font-size="12" font-weight="500" fill="#fff">${i+1}</text></g>`
    :`<circle cx="${f(x)}" cy="${f(y)}" r="3.2" fill="var(--red)"/>`}).join("");
  const label=big?`<text x="${w-14}" y="${h-12}" text-anchor="end" font-family="Newsreader,Georgia,serif" font-style="italic" font-size="13" fill="var(--muted)">Seine</text>`:"";
  return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(r.titre)}"><polyline points="${seine}" fill="none" stroke="var(--river)" stroke-width="${big?16:7}" stroke-linecap="round" stroke-linejoin="round"/>${lines}${grey}${red}${label}</svg>`;
}

const SCREENS={
  loading:()=>`<p class="note" style="margin-top:40vh;text-align:center">${t("loading")}</p>`,
  home:()=>{const all=DB.catalog.parcours.map(p=>routeById(p.parcours_id)).filter(Boolean);const main=all.filter(r=>!r.exemple),ex=all.filter(r=>r.exemple);
   const soonC=DB.catalog.villes.filter(v=>v.statut!=="actif").map(v=>L(v.nom)).join(", "),soonT=DB.catalog.thematiques.filter(v=>v.statut!=="actif").map(v=>L(v.nom)).join(", ");

/* ---------- Voix (synthèse vocale de l’appareil : coût nul, hors ligne) ---------- */
const hasSpeech="speechSynthesis" in window;
function voiceFor(lang){if(!hasSpeech)return null;const vs=speechSynthesis.getVoices()||[],norm=s=>(s||"").toLowerCase().replace("_","-"),want=norm(LOCALES[lang]);
  return vs.find(v=>norm(v.lang)===want)||vs.find(v=>norm(v.lang).startsWith(lang))||null}

/* Lecture des étapes : fichier audio s’il existe (ElevenLabs, étape G), sinon voix de synthèse */
const audio={status:"idle",token:0,parts:[],at:0,el:null};
function stopAudio(){audio.token++;if(audio.el){audio.el.pause();audio.el=null}if(hasSpeech&&audio.status!=="idle")speechSynthesis.cancel();audio.status="idle";audio.at=0}
function speakFrom(k){
  const my=++audio.token;speechSynthesis.cancel();
  if(k>=audio.parts.length){audio.status="idle";audio.at=0;renderPlayer();return}
  audio.at=k;const u=new SpeechSynthesisUtterance(audio.parts[k]);u.lang=LOCALES[state.lang];const v=voiceFor(state.lang);if(v)u.voice=v;u.rate=state.rate;
  u.onend=()=>{if(my===audio.token)speakFrom(k+1)};
  speechSynthesis.speak(u);audio.status="playing";renderPlayer();
}
function curPlayable(){return state.screen==="mon"?cur().byId[state.mon]:stopAt(state.idx)}
function togglePlay(){
  const e=curPlayable();
  if(e.audio){
    if(!audio.el){audio.el=new Audio(e.audio);audio.el.playbackRate=state.rate;audio.el.onended=()=>{audio.status="idle";audio.el=null;renderPlayer()}}
    if(audio.status==="playing"){audio.el.pause();audio.status="paused"}else{audio.el.play();audio.status="playing"}
    renderPlayer();return}
  if(!hasSpeech)return;
  if(audio.status==="playing"){speechSynthesis.pause();audio.status="paused"}
  else if(audio.status==="paused"){speechSynthesis.resume();audio.status="playing"}
  else{const txt=(e.texte_long||e.texte_court||"").replace(VERIF,"");
    audio.parts=[e.titre+".",...(e.accroche?[e.accroche]:[]),...paras(txt).join(" ").split(/(?<=[.!?])\s+/)];speakFrom(0);return}
  renderPlayer();
}
function cycleRate(){const rates=[0.9,1,1.15];state.rate=rates[(rates.indexOf(state.rate)+1)%rates.length];
  if(audio.el){audio.el.playbackRate=state.rate;renderPlayer()}else if(audio.status==="playing")speakFrom(audio.at);else renderPlayer()}
function renderPlayer(){
  const slot=document.getElementById("player-slot");
  if(state.screen!=="place"&&state.screen!=="mon"){slot.innerHTML="";return}
  const e=curPlayable(),canPlay=!!e.audio||hasSpeech;
  const st=!canPlay?t("noSpeech"):audio.status==="playing"?t("playing"):audio.status==="paused"?t("paused"):e.audio?t("listen"):t("ttsNote");
  slot.innerHTML=`<div class="player"><div class="player-in">
    <button class="play" data-action="play" aria-label="${audio.status==="playing"?t("paused"):t("listen")}"${canPlay?"":" disabled"}>${audio.status==="playing"?I.pause:I.play}</button>
    <div class="ptext"><b>${t("listen")}</b><span>${st}</span></div>
    <button class="speed" data-action="rate" aria-label="Vitesse">${state.rate.toLocaleString(state.lang)}×</button>
  </div></div>`;
}
function toast(msg){const el=document.createElement("div");el.className="toast";el.setAttribute("role","status");el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),1800)}
async function copyText(s){try{await navigator.clipboard.writeText(s)}catch(e){const ta=document.createElement("textarea");ta.value=s;document.body.appendChild(ta);ta.select();try{document.execCommand("copy")}catch(_){}ta.remove()}toast(t("copied"))}

/* ---------- Guide vocal rue par rue ----------
   Itinéraire piéton : service OSRM « routed-foot » de FOSSGIS (données OpenStreetMap).
   Position : GPS du téléphone, ou marche simulée pour tester à distance. */
const OSRM="https://routing.openstreetmap.de/routed-foot/route/v1/foot/";
const SIM_SPEED=(()=>{try{return +new URLSearchParams(location.search).get("simspeed")||4}catch(e){return 4}})();
const G={on:false,sim:false,seq:0,unlocked:false,watch:null,simTimer:null,metroTimer:null,wake:null};
const K0=Math.cos(48.855*Math.PI/180);
const toXY=(lat,lng)=>[lng*K0*111320,lat*110574];
const nav=()=>NAV[state.lang]||NAV.fr;
function bearing(a,b){const r=Math.PI/180,y=Math.sin((b.lng-a.lng)*r)*Math.cos(b.lat*r),x=Math.cos(a.lat*r)*Math.sin(b.lat*r)-Math.sin(a.lat*r)*Math.cos(b.lat*r)*Math.cos((b.lng-a.lng)*r);return (Math.atan2(y,x)/r+360)%360}
function modFromTurn(before,after){const d=((after-before+540)%360)-180,a=Math.abs(d),s=d>0?"right":"left";
  if(a<20)return "straight";if(a<60)return "slight "+s;if(a<135)return s;if(a<170)return "sharp "+s;return "uturn"}
const dirOf=b=>nav().dirs[Math.round((((b||0)%360)+360)%360/45)%8];
const roundSay=m=>m<100?Math.max(10,Math.round(m/10)*10):Math.round(m/50)*50;
function sayDist(m){const N=nav();return m<1000?N.m(roundSay(m)):N.km((Math.round(m/100)/10).toLocaleString(state.lang))}
function fmtDist(m){return m<1000?`${m<100?Math.max(5,Math.round(m/5)*5):Math.round(m/10)*10} m`:`${(Math.round(m/100)/10).toLocaleString(state.lang)} km`}

/* Nettoyage des étapes OSRM : on retire les « tout droit » inutiles et on fusionne les virages collés */
function buildSteps(raw){
  const quiet=new Set(["new name","continue","notification","use lane","suppressed","exit roundabout","exit rotary"]),res=[];
  for(const r of raw){const m=r.maneuver,s={type:m.type,mod:m.modifier||"straight",name:r.name||"",dist:r.distance||0,lat:m.location[1],lng:m.location[0],bb:m.bearing_before||0,ba:m.bearing_after||0,exit:m.exit};
    const last=res[res.length-1];
    if(last&&s.type!=="arrive"&&quiet.has(s.type)&&(s.mod==="straight"||s.type.startsWith("exit"))){last.dist+=s.dist;continue}
    if(last&&last.type!=="depart"&&s.type!=="arrive"&&last.dist<3){
      last.mod=modFromTurn(last.bb,s.ba);last.ba=s.ba;last.dist+=s.dist;last.name=s.name||last.name;last.exit=s.exit;last.type=s.exit?s.type:"turn";
      if(last.mod==="straight"&&!last.exit){res.pop();const prev=res[res.length-1];if(prev)prev.dist+=last.dist}
      continue}
    res.push(s)}
  return res}
function makeRoute(coords,steps,fallback){
  const cum=[0];for(let i=1;i<coords.length;i++)cum.push(cum[i-1]+dist({lat:coords[i-1][0],lng:coords[i-1][1]},{lat:coords[i][0],lng:coords[i][1]}));
  const len=cum[cum.length-1];let j=0;
  steps.forEach(s=>{let best=j,bd=Infinity;
    for(let i=j;i<coords.length;i++){const d=Math.abs(coords[i][0]-s.lat)+Math.abs(coords[i][1]-s.lng);if(d<bd){bd=d;best=i;if(d<1e-6)break}}
    j=best;s.along=cum[best]});
  const last=steps[steps.length-1];if(last&&last.type==="arrive")last.along=len;
  return {coords,cum,len,steps,fallback}}
async function fetchRoute(o,tg){
  const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),9000);
  try{
    const res=await fetch(`${OSRM}${o.lng.toFixed(6)},${o.lat.toFixed(6)};${tg.lng.toFixed(6)},${tg.lat.toFixed(6)}?overview=full&geometries=geojson&steps=true`,{signal:ctl.signal});
    if(!res.ok)throw new Error("HTTP "+res.status);
    const d=await res.json();if(d.code!=="Ok"||!d.routes||!d.routes[0])throw new Error(d.code);
    const rt=d.routes[0],coords=rt.geometry.coordinates.map(c=>[c[1],c[0]]);
    if(coords.length<2)throw new Error("geometry");
    return makeRoute(coords,buildSteps(rt.legs[0].steps),false)}
  catch(e){const d=dist(o,tg);/* repli : ligne droite */
    return makeRoute([[o.lat,o.lng],[tg.lat,tg.lng]],[{type:"depart",mod:"straight",name:"",dist:d,lat:o.lat,lng:o.lng,bb:0,ba:bearing(o,tg)},{type:"arrive",mod:"straight",name:"",dist:0,lat:tg.lat,lng:tg.lng,bb:0,ba:0}],true)}
  finally{clearTimeout(tm)}}
function snap(R,p){const P=toXY(p.lat,p.lng),from=G.lastAlong||0;let best=null;
  for(let i=0;i<R.coords.length-1;i++){
    if(R.cum[i+1]<from-40)continue;
    const A=toXY(R.coords[i][0],R.coords[i][1]),B=toXY(R.coords[i+1][0],R.coords[i+1][1]),dx=B[0]-A[0],dy=B[1]-A[1],L2=dx*dx+dy*dy;
    let u=L2?((P[0]-A[0])*dx+(P[1]-A[1])*dy)/L2:0;u=Math.max(0,Math.min(1,u));
    const d=Math.hypot(P[0]-(A[0]+u*dx),P[1]-(A[1]+u*dy));
    if(!best||d<best.off)best={off:d,along:R.cum[i]+u*(R.cum[i+1]-R.cum[i])}}
  return best||{off:Infinity,along:0}}
function pointAt(R,s){
  for(let i=1;i<R.coords.length;i++){if(R.cum[i]>=s){const f=(s-R.cum[i-1])/((R.cum[i]-R.cum[i-1])||1),a=R.coords[i-1],b=R.coords[i];return {lat:a[0]+f*(b[0]-a[0]),lng:a[1]+f*(b[1]-a[1])}}}
  const c=R.coords[R.coords.length-1];return {lat:c[0],lng:c[1]}}

/* Textes des instructions */
function targetTitle(){if(G.kind==="station")return t("stationSpoken",G.leg.montee.nom);return stopAt(state.idx).titre}
function stepAct(s){const N=nav();if(s.type==="depart")return N.depart(dirOf(s.ba),"");if(/roundabout|rotary/.test(s.type)&&s.exit)return N.round(s.exit);return N.mods[s.mod]||N.mods.straight}
function stepSay(s){const N=nav();
  if(s.type==="depart")return G.route&&G.route.fallback?N.crow(sayDist(G.route.len),dirOf(s.ba)):N.depart(dirOf(s.ba),s.name);
  return stepAct(s)+(s.name?N.onto(s.name):"")}
function stepIcon(s){if(s.type==="arrive")return I.pin;if(/roundabout|rotary/.test(s.type))return I.round;if(s.mod==="uturn")return I.uturn;return I.arrow(TURN_ANGLE[s.mod]||0)}

/* Parole du guide : les annonces se mettent en file d’attente */
function unlockSpeech(){if(hasSpeech&&!G.unlocked){try{const u=new SpeechSynthesisUtterance(" ");u.volume=0;speechSynthesis.speak(u);G.unlocked=true}catch(e){}}}
function say(text,opts={}){G.lastSaid=text;
  if(!hasSpeech||(!state.voice&&!opts.force)){if(opts.onend)setTimeout(opts.onend,700);return}
  const u=new SpeechSynthesisUtterance(text);u.lang=LOCALES[state.lang];const v=voiceFor(state.lang);if(v)u.voice=v;
  if(opts.onend){let done=false;const fin=()=>{if(!done){done=true;opts.onend()}};u.onend=fin;u.onerror=fin;setTimeout(fin,2500+text.length*80)}
  speechSynthesis.speak(u)}
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
function wakeOn(){try{if("wakeLock" in navigator&&!G.wake)navigator.wakeLock.request("screen").then(l=>{G.wake=l;l.addEventListener("release",()=>{G.wake=null})}).catch(()=>{})}catch(e){}}
function wakeOff(){try{G.wake&&G.wake.release()}catch(e){}G.wake=null}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&G.on)wakeOn()});

/* Cycle de guidage d’une étape */
function setTarget(){const p=stopAt(state.idx);
  if(G.phase==="toStation"){G.kind="station";G.target={lat:G.leg.montee.lat,lng:G.leg.montee.lng}}
  else{G.kind="place";G.target={...ll(p)}}}
function simOrigin(){const r=cur(),i=state.idx;
  if(G.phase==="fromStation"||G.phase==="metro")return G.leg.descente;
  return i>0?ll(r.ins[i-1]):r.depart.coordonnees}
function stopTracking(){if(G.watch!=null&&navigator.geolocation)navigator.geolocation.clearWatch(G.watch);G.watch=null;clearInterval(G.simTimer);G.simTimer=null}
function stopGuide(){if(hasSpeech&&G.on&&!G.arrived&&audio.status==="idle")speechSynthesis.cancel();stopTracking();clearTimeout(G.metroTimer);G.on=false;G.seq++;wakeOff()}
function startGuide(){stopGuide();
  const r=cur(),i=state.idx,prev=i>0?r.ins[i-1]:null,lg=prev?legOf(r,prev.id,r.ins[i].id):null;
  Object.assign(G,{on:true,leg:lg&&lg.type==="metro"?lg:null,route:null,pos:null,arrived:false,computing:false,info:null,adv:new Set(),now:new Set(),off:0,lastAlong:0,lastRoute:0,startOff:0,lastSaid:""});
  G.phase=G.leg?"toStation":"walk";G.status=G.sim?"computing":"locating";setTarget();
  state.screen="guide";wakeOn();render();
  if(G.sim)startSim(simOrigin());else startWatch()}
function startWatch(){stopTracking();
  if(!("geolocation" in navigator)){G.status="nogps";updateGuideUI();return}
  G.watch=navigator.geolocation.watchPosition(onFix,onGeoErr,{enableHighAccuracy:true,maximumAge:3000,timeout:30000})}
function onFix(e){if(!G.on||G.sim)return;const p={lat:e.coords.latitude,lng:e.coords.longitude,acc:e.coords.accuracy||0};
  if(G.phase==="metro"||G.route||G.computing){navTick(p);return}
  G.pos=p;if(dist(p,G.target)>15000){G.status="far";updateGuideUI();return}
  computeRoute(p,true)}
function onGeoErr(e){if(!G.on||G.sim)return;if(e.code===1)G.status="denied";else if(e.code===2)G.status="nogps";else return;updateGuideUI()}
async function startSim(o){stopTracking();G.pos={lat:o.lat,lng:o.lng,acc:5};G.status="computing";updateGuideUI();
  await computeRoute(G.pos,true);if(!G.on||!G.sim||!G.route)return;
  const R=G.route;let s=0;
  G.simTimer=setInterval(()=>{if(!G.on||G.route!==R){clearInterval(G.simTimer);return}
    s=Math.min(R.len,s+1.4*SIM_SPEED*0.5);navTick({...pointAt(R,s),acc:5})},500)}
async function computeRoute(o,intro){const my=++G.seq;G.computing=true;if(!G.route)G.status="computing";updateGuideUI();
  const R=await fetchRoute(o,G.target);
  if(my!==G.seq||!G.on)return;
  Object.assign(G,{computing:false,route:R,adv:new Set(),now:new Set(),lastAlong:0,off:0,lastRoute:Date.now(),info:null,status:R.fallback?"offline":"ok"});
  G.startOff=snap(R,o).off;
  drawGuideMap();
  const N=nav();let txt="";
  if(intro)txt+=t("routeIntro",targetTitle(),sayDist(R.len),Math.max(1,Math.round(R.len/75)))+" ";
  txt+=cap(stepSay(R.steps[0]))+".";
  const s1=R.steps[1];
  if(s1&&s1.type!=="arrive"&&s1.along>12&&s1.along<=50){txt+=" "+cap(`${N.in(sayDist(s1.along))}, ${stepSay(s1)}`)+".";G.adv.add(1)}
  say(txt);
  navTick(G.pos||o)}
function navTick(p){if(!G.on)return;G.pos=p;
  if(G.phase==="metro"){if(!G.sim&&dist(p,G.leg.descente)<150)leaveMetro();return}
  const R=G.route;if(!R||G.arrived||G.computing){updateGuideUI();return}
  const sn=snap(R,p);if(sn.along>30)G.startOff=0;
  const tol=Math.max(30,Math.min(60,(p.acc||0)*1.2),G.startOff+15),isOff=sn.off>tol;
  if(isOff){G.off++;if(G.off>=2&&Date.now()-G.lastRoute>(R.fallback?45000:12000)){if(!R.fallback)say(t("rerouting"));computeRoute(p,false);return}}
  else{G.off=0;G.lastAlong=Math.max(G.lastAlong,sn.along)}
  const along=isOff?G.lastAlong:sn.along,remain=Math.max(0,R.len-along);
  if(remain<=15||dist(p,G.target)<=18){arrive();return}
  const N=nav();let k=R.steps.findIndex((s,i)=>i>0&&s.along>along+2);if(k<0)k=R.steps.length-1;
  const s=R.steps[k],d=Math.max(0,s.along-along),gap=s.along-R.steps[k-1].along;
  if(s.type==="arrive"){if(!G.adv.has(k)&&d<=50&&d>20&&gap>=40){G.adv.add(k);say(cap(`${N.in(sayDist(d))}, ${N.arriveSoon}`)+".")}}
  else{
    if(!G.adv.has(k)&&d<=50&&d>15&&gap>=30){G.adv.add(k);say(cap(`${N.in(sayDist(d))}, ${stepSay(s)}`)+".")}
    if(!G.now.has(k)&&d<=12){G.now.add(k);G.adv.add(k);let txt=cap(stepSay(s));
      /* virages rapprochés (traversées en zigzag) : annoncés d’une traite */
      for(let j=k+1;j<=k+2;j++){const a=R.steps[j-1],b=R.steps[j];if(!b||b.type==="arrive"||b.along-a.along>=15)break;
        txt+=`, ${N.then} ${stepSay(b)}`;G.adv.add(j);G.now.add(j)}
      say(txt+".");buzz(60)}}
  G.info={k,d,remain};updateGuideUI()}
function arrive(){if(G.arrived||!G.on)return;G.arrived=true;G.seq++;G.computing=false;stopTracking();buzz([90,60,90]);
  if(G.phase==="toStation"){enterMetro();return}
  G.status="arrived";G.info=null;updateGuideUI();
  say(t("arrived",targetTitle()),{onend:()=>{if(G.on&&state.screen==="guide"){state.autoplay=true;go("place")}}})}
function enterMetro(){const lg=G.leg;Object.assign(G,{phase:"metro",kind:"metro",route:null,info:null,arrived:false,status:"metro"});render();
  say(t("arrived",t("stationSpoken",lg.montee.nom))+" "+t("metroSay",lg.ligne,lg.direction,lg.descente.nom,lg.arrets),
    {onend:()=>{if(G.on&&G.sim&&G.phase==="metro")G.metroTimer=setTimeout(leaveMetro,3000)}});
  if(!G.sim)startWatch()}
function leaveMetro(){if(!G.on||G.phase!=="metro")return;clearTimeout(G.metroTimer);
  Object.assign(G,{phase:"fromStation",route:null,info:null,arrived:false,status:"computing"});setTarget();render();
  if(G.sim)startSim(G.leg.descente);else if(G.pos)computeRoute(G.pos,true);else G.status="locating"}
function toggleSim(){G.sim=!G.sim;stopTracking();clearTimeout(G.metroTimer);G.seq++;
  Object.assign(G,{route:null,computing:false,arrived:false,info:null,lastAlong:0});
  if(G.phase==="metro"){render();if(G.sim)G.metroTimer=setTimeout(leaveMetro,3000);else startWatch();return}
  G.status=G.sim?"computing":"locating";render();
  if(G.sim)startSim(simOrigin());else startWatch()}
function repeatInstr(){const N=nav();
  if(G.phase==="metro"){const lg=G.leg;say(t("metroSay",lg.ligne,lg.direction,lg.descente.nom,lg.arrets),{force:true});return}
  const R=G.route,i=G.info;
  if(R&&i){const s=R.steps[i.k];say(cap(`${N.in(sayDist(i.d))}, ${s.type==="arrive"?N.arriveSoon:stepSay(s)}`)+".",{force:true});return}
  if(G.lastSaid)say(G.lastSaid,{force:true})}

/* Affichage du guidage */
function updateGuideUI(){if(state.screen!=="guide")return;const $=id=>document.getElementById(id),ico=$("g-ico");if(!ico)return;
  let icon=I.locate,d="",instr="",name="",then="",remain="–",time="–";
  if(G.phase==="metro"&&G.leg){const lg=G.leg;icon=I.metro;d=`${t("line")} ${lg.ligne}`;instr=`${t("direction")} ${lg.direction}`;name=t("alightAt",lg.descente.nom,lg.arrets)}
  else if(G.status==="arrived"){icon=I.pin;instr=t("arrivedShort");name=G.kind==="station"?G.leg.montee.nom:targetTitle()}
  else if(G.route&&G.info){const R=G.route,s=R.steps[G.info.k];icon=stepIcon(s);d=fmtDist(G.info.d);
    if(s.type==="arrive"){instr=G.kind==="station"?G.leg.montee.nom:targetTitle();name=t("destination")}
    else{instr=cap(stepAct(s));name=s.name}
    const n2=R.steps[G.info.k+1];if(n2&&n2.type!=="arrive")then=t("thenLine",stepAct(n2)+(n2.name?` · ${n2.name}`:""));
    remain=fmtDist(G.info.remain);time=`${Math.max(1,Math.round(G.info.remain/75))} min`}
  else instr=G.status==="far"?t("farShort"):(G.status==="denied"||G.status==="nogps")?t("noLoc"):G.status==="computing"?t("computing"):t("locating");
  ico.innerHTML=icon;$("g-dist").textContent=d;$("g-instr").textContent=instr;$("g-name").textContent=name;$("g-then").textContent=then;
  if($("g-remain")){$("g-remain").textContent=remain;$("g-time").textContent=time}
  let msg="";
  if(G.status==="far")msg=t("far");else if(G.status==="denied")msg=t("gpsDenied");else if(G.status==="nogps")msg=t("gpsNone");
  else if(G.status==="offline")msg=t("offline");else if(G.sim)msg=t("simOn");
  else if(G.pos&&G.pos.acc>50)msg=t("weak");else if(G.route&&!("wakeLock" in navigator))msg=t("keepOn");
  $("g-status").textContent=msg;
  updateDot()}
function drawGuideMap(){const el=document.getElementById("g-map");if(!el)return;const R=G.route;
  if(!R||G.phase==="metro"){el.innerHTML="";G.proj=null;return}
  const w=400,h=260,pad=26,pts=R.coords.map(c=>toXY(c[0],c[1])),xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);
  const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
  const s=Math.min((w-2*pad)/((maxX-minX)||1),(h-2*pad)/((maxY-minY)||1));
  const ox=pad+((w-2*pad)-(maxX-minX)*s)/2,oy=pad+((h-2*pad)-(maxY-minY)*s)/2;
  const P=(lat,lng)=>{const [x,y]=toXY(lat,lng);return [ox+(x-minX)*s,oy+(maxY-y)*s]};G.proj=P;
  const f=n=>n.toFixed(1),line=R.coords.map(c=>P(c[0],c[1]).map(f).join(",")).join(" ");
  const turns=R.steps.slice(1,-1).map(st=>{const [x,y]=P(st.lat,st.lng);return `<circle cx="${f(x)}" cy="${f(y)}" r="3.2" fill="var(--surface)" stroke="var(--gline)" stroke-width="1.6"/>`}).join("");
  const [tx,ty]=P(G.target.lat,G.target.lng);
  el.innerHTML=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${t("mapAria")}">
    <polyline points="${line}" fill="none" stroke="var(--gline)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"${R.fallback?' stroke-dasharray="2 9"':""}/>${turns}
    <circle cx="${f(tx)}" cy="${f(ty)}" r="12" fill="${G.kind==="station"?"var(--plaque)":"var(--red)"}" stroke="var(--surface)" stroke-width="2"/>
    <text x="${f(tx)}" y="${f(ty+4.5)}" text-anchor="middle" font-family="Jost,sans-serif" font-size="12" font-weight="500" fill="#fff">${G.kind==="station"?"M":state.idx+1}</text>
    <circle id="g-me" cx="-20" cy="-20" r="8" fill="var(--ink)" stroke="var(--surface)" stroke-width="3"/></svg>`}
function updateDot(){const me=document.getElementById("g-me");if(!me||!G.proj||!G.pos)return;
  let [x,y]=G.proj(G.pos.lat,G.pos.lng);x=Math.max(8,Math.min(392,x));y=Math.max(8,Math.min(252,y));
  me.setAttribute("cx",x.toFixed(1));me.setAttribute("cy",y.toFixed(1))}

/* ---------- Rendu et événements ---------- */
function render(){
  stopAudio();
  document.documentElement.lang=state.lang;
  const app=document.getElementById("app");
  app.innerHTML=`<div class="screen">${SCREENS[state.screen]()}</div>`;
  renderPlayer();window.scrollTo(0,0);
  if(state.screen==="guide"){drawGuideMap();updateGuideUI()}
  if(state.screen==="place"&&state.autoplay){state.autoplay=false;
    if(state.voice&&(hasSpeech||stopAt(state.idx).audio))setTimeout(()=>{if(state.screen==="place"&&audio.status==="idle")togglePlay()},400)}
}
function go(screen){if(state.screen==="guide"&&screen!=="guide")stopGuide();state.screen=screen;render()}
function openGuide(i){state.guided=true;state.idx=i;unlockSpeech();startGuide()}
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-action]");if(!el||el.disabled)return;
  const a=el.dataset.action;
  if(a==="go")go(el.dataset.to);
  else if(a==="route"){state.route=el.dataset.id;go("route")}
  else if(a==="open"){state.guided=false;state.idx=+el.dataset.i;go("place")}
  else if(a==="mon"){state.back=state.screen==="place"?"place":"route";state.mon=el.dataset.id;go("mon")}
  else if(a==="guide")openGuide(+el.dataset.i);
  else if(a==="step"){const n=cur().ins.length,dd=+el.dataset.d,j=state.idx+dd;
    if(j>=n)go("done");else if(j>=0){if(state.guided&&dd===1)openGuide(j);else{state.idx=j;go("place")}}}
  else if(a==="copy")copyText(el.dataset.text);
  else if(a==="play")togglePlay();
  else if(a==="rate")cycleRate();
  else if(a==="voice"){state.voice=!state.voice;try{localStorage.setItem("flanerie-voice",state.voice?"on":"off")}catch(_){}
    if(!state.voice&&hasSpeech&&audio.status==="idle")speechSynthesis.cancel();
    el.setAttribute("aria-pressed",String(state.voice));el.textContent=state.voice?t("voiceOn"):t("voiceOff")}
  else if(a==="repeat")repeatInstr();
  else if(a==="here")arrive();
  else if(a==="metroexit")leaveMetro();
  else if(a==="sim"){unlockSpeech();toggleSim()}
});
document.addEventListener("change",async e=>{
  if(e.target.dataset.action==="lang"){const lang=e.target.value;try{localStorage.setItem("flanerie-lang",lang)}catch(_){}
    try{await loadLang(lang)}catch(err){}state.lang=DB.content[lang]?lang:"fr";render()}
});
if(hasSpeech)speechSynthesis.onvoiceschanged=()=>{};
(async()=>{
  render();
  try{DB.catalog=await loadJSON("content/catalog.json");await loadLang("fr");if(state.lang!=="fr")await loadLang(state.lang)}
  catch(err){document.getElementById("app").innerHTML=`<p class="note" style="margin-top:40vh;text-align:center">Contenu indisponible (${esc(err.message)}).</p>`;return}
  state.screen="home";render();
})();
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost"||location.hostname==="127.0.0.1"))
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
