function addTrace(entry,r){const {map,P,flavor}=entry,tr=MAPS.traces[r.parcours_id],before=firstSymbol(map);
  const data=tr||{type:"FeatureCollection",features:r.ins.slice(1).map((e,i)=>({type:"Feature",properties:{mode:"pied"},geometry:{type:"LineString",coordinates:[[ll(r.ins[i]).lng,ll(r.ins[i]).lat],[ll(e).lng,ll(e).lat]]}}))};
  map.addSource("trace",{type:"geojson",data});
  if(flavor==="apple")map.addLayer({id:"trace-case",type:"line",source:"trace",filter:["==",["get","mode"],"pied"],layout:{"line-cap":"round","line-join":"round"},paint:{"line-color":P.routeCase,"line-width":["interpolate",["linear"],["zoom"],12,5,17,11]}},before);
  map.addLayer({id:"trace-line",type:"line",source:"trace",filter:["==",["get","mode"],"pied"],layout:{"line-cap":"round","line-join":"round"},
    paint:flavor==="apple"?{"line-color":P.route,"line-width":["interpolate",["linear"],["zoom"],12,3,17,7]}:{"line-color":P.route,"line-width":["interpolate",["linear"],["zoom"],12,4,17,8],"line-dasharray":[0,1.7]}},before);
  map.addLayer({id:"trace-metro",type:"line",source:"trace",filter:["==",["get","mode"],"metro"],layout:{"line-cap":"round"},paint:{"line-color":"#1F3A5F","line-width":3,"line-dasharray":[1.5,1.5]}},before)}

async function mountRouteMap(wrap,r,kind){
  if(!wrap||!r)return;const tr=MAPS.traces[r.parcours_id];
  const pts=[...r.ins,...r.std].map(e=>[ll(e).lng,ll(e).lat]).concat(tr?tr.features.flatMap(f=>f.geometry.coordinates):[]);
  const entry=await createMap(wrap,{kind,points:pts,coop:kind==="route",interactive:kind==="route",padding:kind==="intro"?34:54});
  if(!entry)return;const {map,flavor}=entry,gl=window.maplibregl;
  try{addTrace(entry,r)}catch(e){}
  r.std.forEach(m=>{const mk=new gl.Marker({element:mkMon()}).setLngLat([ll(m).lng,ll(m).lat]);if(kind==="route")mk.setPopup(popupFor(m,"mon"));mk.addTo(map)});
  r.ins.forEach((p,i)=>{const mk=new gl.Marker({element:mkIns(i+1,flavor),anchor:flavor==="google"?"bottom":"center"}).setLngLat([ll(p).lng,ll(p).lat]);if(kind==="route")mk.setPopup(popupFor(p,"ins",i));mk.addTo(map)});
  if(kind==="route"){map.addControl(new gl.NavigationControl({showCompass:true,visualizePitch:true}),"top-right");
    map.addControl(new gl.GeolocateControl({positionOptions:{enableHighAccuracy:true},trackUserLocation:true}),"top-right")}}
function mountWhenVisible(wrap,fn){if(!wrap)return;if(!("IntersectionObserver" in window)){fn();return}
  const holder={io:null};MAPS.list.push(holder);
  holder.io=new IntersectionObserver(es=>{if(es.some(x=>x.isIntersecting)){holder.io.disconnect();MAPS.list=MAPS.list.filter(x=>x!==holder);fn()}},{rootMargin:"200px"});holder.io.observe(wrap)}

/* Carte du guide vocal : itinéraire de l'étape, destination et position, en vue inclinée */
const guideEntry=()=>MAPS.list.find(m=>m.kind==="guide"&&m.ready&&document.body.contains(m.el));
function drawGuideMap(){drawGuideMapSVG();const wrap=document.getElementById("g-wrap");if(!wrap||!G.route||G.phase==="metro")return;
  const R=G.route,coords=R.coords.map(c=>[c[1],c[0]]),line={type:"Feature",properties:{},geometry:{type:"LineString",coordinates:coords}};
  const e=guideEntry();
  if(e){e.map.getSource("leg").setData(line);e.target.setLngLat([G.target.lng,G.target.lat]);e.target.getElement().innerHTML=G.kind==="station"?"<span>M</span>":`<span>${state.idx+1}</span>`;
    e.map.fitBounds(boundsOf(coords.concat(G.pos?[[G.pos.lng,G.pos.lat]]:[])),{padding:60,pitch:45,duration:600});return}
  if(MAPS.list.some(m=>m.kind==="guide"&&m.el===wrap))return;
  createMap(wrap,{kind:"guide",points:coords,padding:60,pitch:45}).then(en=>{if(!en)return;const {map,P,flavor}=en,gl=window.maplibregl,r=cur();
    if(MAPS.traces[r.parcours_id])map.addSource("trace",{type:"geojson",data:MAPS.traces[r.parcours_id]}),map.addLayer({id:"trace-ghost",type:"line",source:"trace",layout:{"line-cap":"round"},paint:{"line-color":P.route,"line-width":3,"line-opacity":.25}},firstSymbol(map));
    map.addSource("leg",{type:"geojson",data:{type:"Feature",properties:{},geometry:{type:"LineString",coordinates:G.route?G.route.coords.map(c=>[c[1],c[0]]):coords}}});
    if(flavor==="apple")map.addLayer({id:"leg-case",type:"line",source:"leg",layout:{"line-cap":"round","line-join":"round"},paint:{"line-color":P.routeCase,"line-width":11}},firstSymbol(map));
    map.addLayer({id:"leg",type:"line",source:"leg",layout:{"line-cap":"round","line-join":"round"},paint:flavor==="apple"?{"line-color":P.route,"line-width":7}:{"line-color":P.route,"line-width":8,"line-dasharray":[0,1.7]}},firstSymbol(map));
    const tg=document.createElement("div");tg.className="mk mk-a"+(G.kind==="station"?" st":"");tg.innerHTML=G.kind==="station"?"<span>M</span>":`<span>${state.idx+1}</span>`;
    en.target=new gl.Marker({element:tg}).setLngLat([G.target.lng,G.target.lat]).addTo(map);
    en.me=new gl.Marker({element:mkMe(P.me)}).setLngLat(G.pos?[G.pos.lng,G.pos.lat]:coords[0]).addTo(map);
    map.addControl(new gl.NavigationControl({showCompass:true,visualizePitch:true}),"top-right");
    updateDot()})}
function updateDot(){updateDotSVG();const e=guideEntry();if(!e||!e.me||!G.pos)return;const p=[G.pos.lng,G.pos.lat];e.me.setLngLat(p);
  const now=Date.now();if(G.route&&now-(e.lastCam||0)>2500&&!e.map.isMoving()){e.lastCam=now;e.map.easeTo({center:p,zoom:Math.max(e.map.getZoom(),16.5),pitch:50,duration:900})}}

/* Liens vers l'application de cartes de l'appareil (ou celle choisie) */
function routeAppURL(r){const s=r.ins,c=e=>`${ll(e).lat},${ll(e).lng}`;
  if(mapFlavor()==="apple")return `https://maps.apple.com/?daddr=${c(s[0])}&dirflg=w`;
  const o=r.depart&&r.depart.coordonnees?`${r.depart.coordonnees.lat},${r.depart.coordonnees.lng}`:c(s[0]);
  const way=(r.depart&&r.depart.coordonnees?s.slice(0,-1):s.slice(1,-1)).map(c).join("|");
  return `https://www.google.com/maps/dir/?api=1&origin=${o}&destination=${c(s[s.length-1])}${way?`&waypoints=${encodeURIComponent(way)}`:""}&travelmode=walking`}
const flavorToggle=()=>{const f=mapFlavor();return `<div class="map-ui" role="group" aria-label="${esc(mt("style"))}"><button data-action="mapflavor" data-v="apple" aria-pressed="${f==="apple"}">${esc(mt("apple"))}</button><button data-action="mapflavor" data-v="google" aria-pressed="${f==="google"}">Google Maps</button></div>`};
const mapBlock=(id,r,ui)=>`<div class="map-real${ui?" tall":""}" id="${id}"><div class="fallback">${mapSVG(r,{labels:true})}</div><div class="mapgl"></div>${ui?flavorToggle():""}</div>`;

/* ---------- Rendu, historique (bouton retour du téléphone) et événements ---------- */
const CACHE_NAME="flanerie-v4";
function navSnap(d){return {screen:state.screen==="guide"?"route":state.screen,route:state.route,idx:state.idx,mon:state.mon,step:state.step,back:state.back,depth:d}}
function push(){const d=((history.state&&history.state.depth)||0)+1;try{history.pushState(navSnap(d),"")}catch(e){}}
function replace(){try{history.replaceState(navSnap((history.state&&history.state.depth)||0),"")}catch(e){}}
function render(o={}){
  stopAudio();destroyMaps();
  document.documentElement.lang=state.lang;document.documentElement.dir=state.lang==="ar"?"rtl":"ltr";ensureFonts(state.lang);
  const y=window.scrollY,app=document.getElementById("app");
  app.innerHTML=`<div class="screen">${SCREENS[state.screen]()}</div>`;
  renderPlayer();window.scrollTo(0,o.keepScroll?y:0);
  if(o.keepScroll){const s=app.querySelector(".screen");if(s)s.style.animation="none"}
  if(state.screen==="guide"){drawGuideMap();updateGuideUI()}
  if(state.screen==="place")bindGallery(stopAt(state.idx));
  if(state.screen==="mon")bindGallery(cur().byId[state.mon]);
  if(state.screen==="route"){saveOffline(cur());mountRouteMap(document.getElementById("route-map"),cur(),"route")}
  if(state.screen==="intro"){const w=document.getElementById("intro-map");mountWhenVisible(w,()=>mountRouteMap(w,featured(),"intro"))}
  if(state.screen==="place"&&state.autoplay){state.autoplay=false;
    if(state.voice&&(hasSpeech||stopAt(state.idx).audio))setTimeout(()=>{if(state.screen==="place"&&audio.status==="idle")togglePlay()},400)}
}
function go(screen,o={}){if(state.screen==="guide"&&screen!=="guide")stopGuide();state.screen=screen;if(!o.noPush)push();render()}
function openGuide(i){state.guided=true;state.idx=i;unlockSpeech();startGuide();push()}
window.addEventListener("popstate",e=>{const s=e.state;if(!s||!DB.catalog)return;closeSheet();
  if(state.screen==="guide")stopGuide();
  Object.assign(state,{screen:s.screen,route:s.route,idx:s.idx,mon:s.mon,step:s.step||1,back:s.back||"route"});
  if(["route","place","mon","done"].includes(state.screen)&&!cur())state.screen="intro";
  render()});
function goBack(to){if(history.state&&history.state.depth>0)history.back();else go(to||"intro")}

function fmtDist(m){const u=state.lang==="ar"?["م","كم"]:state.lang==="zh"?["米","公里"]:["m","km"],sp=state.lang==="zh"?"":" ";

  <div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(t("appLang"))}"><div class="grab"></div><h2>${t("appLang")}</h2>${langList("sheet-lang")}
  <button class="btn ghost block" style="margin-top:18px" data-action="sheet-close">${t("close")}</button></div>`}
function closeSheet(){const s=document.getElementById("sheet-slot");if(s)s.innerHTML=""}

/* Hors ligne : on met en cache les photos du parcours dès qu'on l'ouvre */
async function saveOffline(r){
  if(!r||state.offline[r.parcours_id]||!("caches" in window)||!navigator.serviceWorker||!navigator.serviceWorker.controller)return;
  const urls=[...new Set([phURL(coverOf(r),1280),...r.etapes.flatMap(e=>(e.photos||[]).flatMap((p,k)=>k?[phURL(p,960)]:[phURL(p,960),phURL(p,330)]))].filter(Boolean))];
  try{const c=await caches.open(CACHE_NAME);
    await Promise.all(urls.map(async u=>{if(await c.match(u))return;try{const res=await fetch(u,{mode:"cors",referrerPolicy:"no-referrer"});if(res.ok)await c.put(u,res)}catch(e){}}));
    state.offline[r.parcours_id]=true;const el=document.getElementById("offline");if(el)el.hidden=false}catch(e){}}

async function shareApp(){const url=location.href.split("#")[0].split("?")[0],data={title:"Flânerie",text:t("shareText"),url};
  try{if(navigator.share){await navigator.share(data);return}}catch(e){if(e&&e.name==="AbortError")return}
  copyText(url,t("linkCopied"))}

document.addEventListener("click",async e=>{
  const el=e.target.closest("[data-action]");if(!el||el.disabled)return;
  const a=el.dataset.action;
  if(a==="back")goBack(el.dataset.to);
  else if(a==="go")go(el.dataset.to);
  else if(a==="compose"){state.step=+el.dataset.step||1;go("choose")}
  else if(a==="stepnav"){state.step=+el.dataset.step;push();render()}
  else if(a==="city"){state.city=el.dataset.id;store.set("flanerie-city",state.city);state.step=2;push();render()}
  else if(a==="lang-pick"){await setLang(el.dataset.l);render({keepScroll:true})}
  else if(a==="lang-continue"){state.langChosen=true;store.set("flanerie-lang",state.lang);state.step=3;push();render()}
  else if(a==="theme"){state.theme=el.dataset.id;render({keepScroll:true})}
  else if(a==="filter"){state.filter=el.dataset.f;render({keepScroll:true})}
  else if(a==="route"){state.route=el.dataset.id;go("route")}
  else if(a==="others"){state.step=3;go("choose")}
  else if(a==="sheet")openSheet();
  else if(a==="sheet-close")closeSheet();
  else if(a==="sheet-lang"){await setLang(el.dataset.l);closeSheet();render({keepScroll:true})}
  else if(a==="share")shareApp();
  else if(a==="mapflavor"){store.set("flanerie-map",el.dataset.v);render({keepScroll:true})}
  else if(a==="open"){state.guided=false;state.idx=+el.dataset.i;go("place")}
  else if(a==="mon"){state.back=state.screen==="place"?"place":"route";state.mon=el.dataset.id;go("mon")}
  else if(a==="guide")openGuide(+el.dataset.i);
  else if(a==="step"){const n=cur().ins.length,dd=+el.dataset.d,j=state.idx+dd;
    if(j>=n)go("done");else if(j>=0){if(state.guided&&dd===1)openGuide(j);else{state.idx=j;go("place")}}}
  else if(a==="copy")copyText(el.dataset.text);
  else if(a==="play")togglePlay();
  else if(a==="rate")cycleRate();
  else if(a==="voice"){state.voice=!state.voice;store.set("flanerie-voice",state.voice?"on":"off");
    if(!state.voice&&hasSpeech&&audio.status==="idle")speechSynthesis.cancel();
    el.setAttribute("aria-pressed",String(state.voice));el.textContent=state.voice?t("voiceOn"):t("voiceOff")}
  else if(a==="repeat")repeatInstr();
  else if(a==="here")arrive();
  else if(a==="metroexit")leaveMetro();
  else if(a==="sim"){unlockSpeech();toggleSim()}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
window.addEventListener("scroll",()=>{const ft=document.querySelector(".float-top");if(ft)ft.classList.toggle("solid",window.scrollY>Math.max(160,window.innerHeight*.42))},{passive:true});
if(hasSpeech)speechSynthesis.onvoiceschanged=()=>{};
(async()=>{
  try{DB.catalog=await loadJSON("content/catalog.json");await loadLang("fr");if(state.lang!=="fr")await loadLang(state.lang)}
  catch(err){document.getElementById("app").innerHTML=`<div class="loading" style="letter-spacing:.04em;text-transform:none">Contenu indisponible (${esc(err.message)}).</div>`;return}
  if(!DB.content[state.lang])state.lang="fr";
  await Promise.all(DB.catalog.parcours.map(p=>loadTrace(p.parcours_id)));
  const q=new URLSearchParams(location.search).get("parcours");
  state.screen="intro";
  try{history.replaceState(navSnap(0),"")}catch(e){}
  if(q&&routeById(q)){state.route=q;go("route")}else render();
})();
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost"||location.hostname==="127.0.0.1"))
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
