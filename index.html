<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flânerie – Paris insolite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECEEEF;--surface:#F8F9F9;--ink:#1D2630;--muted:#5B6570;--line:#CDD2D6;
  --plaque:#1F3A5F;--frame:#2D6A4F;--river:#CBD6DF;--route:#1D2630;
  --sans:"Jost",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11161B;--surface:#19212A;--ink:#E4E8EB;--muted:#9AA4AE;--line:#2C3843;
    --plaque:#24477A;--frame:#3B7F60;--river:#22313F;--route:#C9D2DA;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11161B;--surface:#19212A;--ink:#E4E8EB;--muted:#9AA4AE;--line:#2C3843;
  --plaque:#24477A;--frame:#3B7F60;--river:#22313F;--route:#C9D2DA;color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--plaque);outline-offset:3px;border-radius:4px}
.app{max-width:480px;margin:0 auto;padding:0 22px 140px}
.screen{animation:in .28s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen{animation:none}}

/* barre haute */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;min-height:56px;gap:12px}
.back{background:none;border:0;padding:10px 0;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:15px}
.back svg{width:18px;height:18px}
.lang{appearance:none;background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 30px 7px 14px;font-size:14px;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 16px) 52%,calc(100% - 11px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.lang option{color:#1D2630}

/* plaque de rue, l'élément signature */
.plaque{display:inline-block;background:var(--plaque);color:#fff;border:5px solid var(--frame);border-radius:12px;
  box-shadow:inset 0 0 0 3px var(--plaque),inset 0 0 0 5px rgba(255,255,255,.92);padding:14px 22px 16px;text-align:center}
.plaque .arr{display:block;font-size:13px;font-weight:400;opacity:.92;margin-bottom:2px}
.plaque .street{display:block;font-weight:500;font-size:22px;letter-spacing:.05em;text-transform:uppercase;line-height:1.15}
.plaque.hero .street{font-size:34px;letter-spacing:.07em}
.plaque.wide{display:block}

/* accueil */
.home-hero{padding:40px 0 8px}
.lede{font-family:var(--serif);font-size:20px;line-height:1.55;color:var(--muted);margin:22px 0 0;max-width:30ch}
.label{font-size:15px;font-weight:500;color:var(--muted);margin:40px 0 4px}
.choice{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;padding:18px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer}
.choice .name{font-size:27px;font-weight:300;line-height:1.15}
.choice .desc{display:block;font-family:var(--serif);font-size:16px;color:var(--muted);margin-top:4px}
.choice .soon{font-size:13px;color:var(--muted);white-space:nowrap}
.choice[disabled]{cursor:default}
.choice[disabled] .name{color:var(--muted)}
.choice .chev{width:18px;height:18px;flex:none;color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin-top:36px}

/* titres */
h1{font-weight:400;font-size:32px;line-height:1.12;letter-spacing:-.01em;margin:18px 0 8px}
.sub{color:var(--muted);font-size:15px;margin:0}
.fallback{font-size:14px;color:var(--muted);background:var(--surface);border-radius:10px;padding:10px 14px;margin:14px 0 0}

/* filtres */
.filters{display:flex;gap:8px;margin:22px 0 6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 16px;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* liste des parcours */
.route{display:grid;grid-template-columns:84px 1fr;gap:16px;align-items:center;width:100%;padding:18px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer}
.thumb{width:84px;height:84px;border-radius:10px;background:var(--surface);overflow:hidden}
.thumb svg{display:block;width:100%;height:100%}
.route .title{font-size:21px;font-weight:400;line-height:1.2}
.route .facts{font-size:14px;color:var(--muted);margin-top:6px;line-height:1.5}

/* détail parcours */
.map{background:var(--surface);border-radius:14px;overflow:hidden;margin-top:20px}
.map svg{display:block;width:100%;height:auto}
.caption{font-size:13px;color:var(--muted);margin:8px 2px 0}
.facts-row{display:flex;gap:28px;margin:22px 0 4px}
.fact b{display:block;font-weight:400;font-size:24px}
.fact span{font-size:13px;color:var(--muted)}
.intro{font-family:var(--serif);font-size:18px;line-height:1.6;margin:18px 0 0}
ol.stops{list-style:none;padding:0;margin:26px 0 0}
.stop{display:grid;grid-template-columns:30px 1fr;gap:14px;align-items:start}
.num{width:30px;height:30px;border-radius:50%;background:var(--plaque);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:500}
.stop button{background:none;border:0;padding:3px 0 0;text-align:left;cursor:pointer}
.stop .t{font-size:18px;line-height:1.25}
.stop .h{display:block;font-family:var(--serif);font-size:15px;color:var(--muted);margin-top:3px}
.leg{display:grid;grid-template-columns:30px 1fr;gap:14px;font-size:13px;color:var(--muted);margin:6px 0}
.leg i{justify-self:center;width:1px;min-height:26px;background:var(--line)}
.leg.metro i{width:3px;background:var(--plaque);border-radius:2px}
.leg span{align-self:center}

.primary{display:block;width:100%;margin-top:30px;background:var(--plaque);color:#fff;border:0;border-radius:999px;padding:16px 22px;font-size:16px;font-weight:500;cursor:pointer}
.secondary{display:block;width:100%;margin-top:12px;background:transparent;border:1px solid var(--line);border-radius:999px;padding:15px 22px;font-size:16px;cursor:pointer}

/* fiche lieu */
.progress{display:flex;gap:4px;margin:6px 0 22px}
.progress span{flex:1;height:3px;border-radius:2px;background:var(--line)}
.progress span.on{background:var(--plaque)}
.step-label{font-size:14px;color:var(--muted);margin:0 0 14px}
.hook{font-family:var(--serif);font-style:italic;font-size:21px;line-height:1.45;margin:20px 0 0}
.body{font-family:var(--serif);font-size:18px;line-height:1.68;margin:18px 0 0}
.body p{margin:0 0 1em}
.photo{margin:26px 0 0;border:1px dashed var(--line);border-radius:12px;padding:16px;font-size:14px;color:var(--muted)}
.photo b{display:block;color:var(--ink);font-weight:500;font-size:14px;margin-bottom:2px}
dl.practical{margin:28px 0 0;display:grid;grid-template-columns:92px 1fr;gap:10px 14px;font-size:15px}
dl.practical dt{color:var(--muted)}
dl.practical dd{margin:0}
.sources{font-size:14px;color:var(--muted);margin:24px 0 0}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:30px}
.nav button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:14px 10px;font-size:15px;cursor:pointer}
.nav button.next{background:var(--plaque);border-color:var(--plaque);color:#fff}
.nav button[disabled]{opacity:.35;cursor:default}

/* lecteur audio */
.player{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);padding:12px 22px calc(12px + env(safe-area-inset-bottom,0px))}
.player-in{max-width:436px;margin:0 auto;display:flex;align-items:center;gap:14px}
.play{flex:none;width:48px;height:48px;border-radius:50%;border:0;background:var(--plaque);color:#fff;display:grid;place-items:center;cursor:pointer}
.play svg{width:20px;height:20px}
.ptext{flex:1;min-width:0}
.ptext b{display:block;font-weight:400;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptext span{font-size:13px;color:var(--muted)}
.speed{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}

.done{text-align:center;padding-top:60px}
.done .lede{margin-left:auto;margin-right:auto}
</style>
</head>
<body>

<script>
/* ---------- Contenu de démonstration (sera produit par le pipeline d’agents) ---------- */
const PLACES = {
  ancre:{title:"Passage de l’Ancre",arr:3,street:"Passage de l’Ancre",lat:48.8648,lng:2.3533,
    address:"223 rue Saint-Martin, 75003",access:"Passage ouvert en journée, horaires variables",
    hook:"Un passage pavé et fleuri, caché entre deux rues très passantes.",

    sources:"Ville de Paris, nomenclature des voies"},
  flamel:{title:"Maison de Nicolas Flamel",arr:3,street:"Rue de Montmorency",lat:48.8634,lng:2.3545,

    hook:"L’une des plus anciennes maisons de Paris, liée à un célèbre « alchimiste ».",
    text:["Construite en 1407, cette maison passe pour l’une des plus anciennes de Paris. Elle fut édifiée par Nicolas Flamel, écrivain public et libraire, qui y logeait des personnes pauvres. En échange, il leur demandait de prier pour les défunts.","Levez les yeux : la façade porte encore une longue inscription gravée et des figures sculptées. Après sa mort, la légende a fait de Flamel un alchimiste qui aurait trouvé la pierre philosophale. Cette réputation a traversé les siècles, jusqu’aux romans d’aujourd’hui."],
    sources:"Base Mérimée ; Wikipédia"},
  defenseur:{title:"Le Défenseur du Temps",arr:3,street:"Rue Bernard-de-Clairvaux",lat:48.8618,lng:2.3527,
    address:"Rue Bernard-de-Clairvaux, quartier de l’Horloge, 75003",access:"Visible depuis la rue, en accès libre",
    hook:"Une horloge géante où un guerrier affronte un dragon, un oiseau et un crabe.",
    text:["À deux pas du Centre Pompidou, un guerrier de laiton brandit son épée face à trois créatures : un dragon, un oiseau et un crabe. Elles figurent la terre, l’air et l’eau.","Cette horloge-automate, œuvre de Jacques Monestier, a été inaugurée en 1979. À chaque heure, le guerrier affrontait l’une des bêtes. Elle est à l’arrêt depuis 2003, faute d’entretien. Immobile, elle reste l’une des curiosités les plus étranges du quartier."],
    sources:"Wikipédia ; presse"},
  miron:{title:"Les maisons à colombages de la rue François-Miron",arr:4,street:"Rue François-Miron",lat:48.8556,lng:2.3572,

    hook:"Deux façades à pans de bois, rescapées du Paris médiéval.",
    text:["Étroites et un peu penchées, ces deux maisons montrent leurs colombages, comme dans une ville de province. Ce sont des maisons à pans de bois d’origine médiévale, devenues très rares à Paris.","À partir du XVIIe siècle, les règlements imposèrent de recouvrir le bois de plâtre pour limiter les incendies. Les colombages sont restés cachés jusqu’à la restauration des façades, en 1967."],
    sources:"Base Mérimée ; Ville de Paris"},
  enceinte:{title:"L’enceinte de Philippe Auguste",arr:4,street:"Rue des Jardins-Saint-Paul",lat:48.8540,lng:2.3610,
    address:"Rue des Jardins-Saint-Paul, 75004",access:"Visible depuis la rue, en accès libre",
    hook:"Le plus long morceau encore visible de la muraille médiévale de Paris.",
    text:["Le long d’un terrain de sport scolaire se dresse un haut mur de pierre, flanqué de tours rondes. C’est le plus long tronçon encore visible de l’enceinte de Philippe Auguste.","Le roi la fit bâtir à partir de 1190, avant de partir en croisade, pour protéger Paris. Au fil des siècles, la muraille a été démolie ou absorbée dans les immeubles. D’autres fragments se cachent encore dans des cours, des caves et des parkings."],

  sens:{title:"L’hôtel de Sens et son boulet de canon",arr:4,street:"Rue du Figuier",lat:48.8532,lng:2.3592,
    address:"1 rue du Figuier, 75004",access:"Extérieur en accès libre ; jardin et bibliothèque aux heures d’ouverture",
    hook:"Une demeure médiévale qui garde un boulet de canon dans sa façade.",
    text:["Tourelles, toits pointus, porche gothique : l’hôtel de Sens est l’une des rares grandes demeures médiévales encore debout à Paris. Il a été bâti à la fin du XVe siècle pour les archevêques de Sens, dont dépendait alors l’évêché de Paris.","Cherchez sur la façade un boulet de canon incrusté dans la pierre, avec la date du 28 juillet 1830 : un souvenir des Trois Glorieuses. L’hôtel abrite aujourd’hui la bibliothèque Forney, consacrée aux arts décoratifs."],
    sources:"Base Mérimée ; Bibliothèques de la Ville de Paris"},
  arenes:{title:"Les arènes de Lutèce",arr:5,street:"Rue des Arènes",lat:48.8452,lng:2.3527,
    address:"49 rue Monge, 75005",access:"Square public, ouvert en journée, gratuit",
    hook:"Un amphithéâtre romain caché derrière les immeubles.",
    text:["Derrière les façades de la rue Monge se cache un amphithéâtre gallo-romain. Construit vers la fin du Ier siècle, il accueillait combats et spectacles devant plusieurs milliers de personnes.","Enfoui et oublié pendant des siècles, il est redécouvert en 1869, lors du percement de la rue Monge. Des personnalités, dont Victor Hugo, militent alors pour le sauver. Aujourd’hui, on y joue aux boules et les enfants courent sur la piste."],

  viviani:{title:"Le plus vieil arbre de Paris",arr:5,street:"Square René-Viviani",lat:48.8521,lng:2.3474,

    text:["Appuyé sur des étais de béton, ce robinier tient debout depuis le début du XVIIe siècle. Il aurait été planté vers 1601 par Jean Robin, botaniste du roi, qui a donné son nom à l’espèce, venue d’Amérique du Nord.","Il est considéré comme le plus vieil arbre de Paris et fleurit encore au printemps. Depuis le square, la vue sur Notre-Dame est l’une des plus belles de la rive gauche."],
    sources:"Ville de Paris ; Wikipédia"},
  chat:{title:"La rue du Chat-qui-Pêche",arr:5,street:"Rue du Chat-qui-Pêche",lat:48.8531,lng:2.3463,
    address:"Entre la rue de la Huchette et le quai Saint-Michel, 75005",access:"Rue piétonne, accès libre",
    hook:"La rue la plus étroite de Paris : moins de deux mètres par endroits.",
    text:["Environ 1,80 mètre de large : c’est la rue la plus étroite de Paris. Elle relie la rue de la Huchette au quai Saint-Michel, à deux pas des foules du quartier Latin.","Son nom viendrait d’une ancienne enseigne représentant un chat attrapant des poissons. Écartez les bras : vous toucherez presque les deux murs."],

function loadLang(){try{const s=localStorage.getItem("flanerie-lang");if(s&&I18N[s])return s}catch(e){}
  const n=(navigator.language||"fr").slice(0,2).toLowerCase();return I18N[n]?n:"fr"}
const state={lang:loadLang(),screen:"home",theme:null,route:null,idx:0,filter:"all",rate:1};
const t=(k,...a)=>{const v=(I18N[state.lang]||I18N.fr)[k];return typeof v==="function"?v(...a):v};
const L=o=>o[state.lang]||o.fr;
const routeById=id=>ROUTES.find(r=>r.id===id);

/* ---------- Géo ---------- */
function dist(a,b){const R=6371000,r=Math.PI/180,dLa=(b.lat-a.lat)*r,dLo=(b.lng-a.lng)*r;
  const h=Math.sin(dLa/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
const legOf=(r,a,b)=>(r.legs||[]).find(l=>l.from===a&&l.to===b);
const walkMeters=(a,b)=>dist(PLACES[a],PLACES[b])*1.3;
const walkMinutes=(a,b)=>Math.max(2,Math.round(walkMeters(a,b)/75));
function routeKm(r){let m=0;for(let i=0;i<r.stops.length-1;i++){if(!legOf(r,r.stops[i],r.stops[i+1]))m+=walkMeters(r.stops[i],r.stops[i+1])}
  return (Math.round(m/100)/10).toLocaleString(state.lang)}

const SEINE=[[48.8420,2.3800],[48.8470,2.3700],[48.8505,2.3615],[48.8522,2.3560],[48.8535,2.3500],[48.8540,2.3460],[48.8555,2.3420],[48.8575,2.3380],[48.8595,2.3320],[48.8615,2.3260],[48.8645,2.3170]];
function mapSVG(r,big){
  const w=big?400:84,h=big?300:84,pad=big?34:14,K=Math.cos(48.855*Math.PI/180);
  const pts=r.stops.map(id=>PLACES[id]);
  const xs=pts.map(p=>p.lng*K),ys=pts.map(p=>p.lat);
  const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
  const s=Math.min((w-2*pad)/((maxX-minX)||1e-4),(h-2*pad)/((maxY-minY)||1e-4));
  const ox=pad+((w-2*pad)-(maxX-minX)*s)/2,oy=pad+((h-2*pad)-(maxY-minY)*s)/2;
  const P=(lat,lng)=>[ox+(lng*K-minX)*s,oy+(maxY-lat)*s];
  const seine=SEINE.map(([a,b])=>P(a,b).map(n=>n.toFixed(1)).join(",")).join(" ");
  let lines="";
  for(let i=0;i<r.stops.length-1;i++){const a=PLACES[r.stops[i]],b=PLACES[r.stops[i+1]],[x1,y1]=P(a.lat,a.lng),[x2,y2]=P(b.lat,b.lng);
    const metro=legOf(r,r.stops[i],r.stops[i+1]);
    lines+=metro?`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--plaque)" stroke-width="${big?3.5:2}" stroke-linecap="round" stroke-dasharray="${big?"1 7":"1 4"}"/>`
               :`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--route)" stroke-width="${big?1.6:1.2}" stroke-dasharray="${big?"5 4":"3 2"}" opacity=".75"/>`}
  const dots=pts.map((p,i)=>{const [x,y]=P(p.lat,p.lng);return big
    ?`<g><circle cx="${x}" cy="${y}" r="12" fill="var(--plaque)" stroke="var(--surface)" stroke-width="2"/><text x="${x}" y="${y+4.5}" text-anchor="middle" font-family="Jost,sans-serif" font-size="12" font-weight="500" fill="#fff">${i+1}</text></g>`
    :`<circle cx="${x}" cy="${y}" r="3.2" fill="var(--plaque)"/>`}).join("");
  const label=big?`<text x="${w-14}" y="${h-12}" text-anchor="end" font-family="Newsreader,Georgia,serif" font-style="italic" font-size="13" fill="var(--muted)">Seine</text>`:"";
  return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${r.title}"><polyline points="${seine}" fill="none" stroke="var(--river)" stroke-width="${big?16:7}" stroke-linecap="round" stroke-linejoin="round"/>${lines}${dots}${label}</svg>`;
}

/* ---------- Icônes ---------- */
const I={
  back:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>`,
  chev:`<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>`,
  play:`<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>`,
  pause:`<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="4" height="14" rx="1"/><rect x="13.5" y="5" width="4" height="14" rx="1"/></svg>`
};

/* ---------- Écrans ---------- */
const langSelect=()=>`<select class="lang" data-action="lang" aria-label="Langue / Language">
  <option value="fr"${state.lang==="fr"?" selected":""}>Français</option>
  <option value="en"${state.lang==="en"?" selected":""}>English</option></select>`;
const bar=(back)=>`<div class="bar">${back?`<button class="back" data-action="go" data-to="${back}">${I.back}${t("back")}</button>`:"<span></span>"}${langSelect()}</div>`;
const fallback=()=>state.lang!=="fr"?`<p class="fallback">${t("fallback")}</p>`:"";
const plaque=(arr,street,cls="")=>`<span class="plaque ${cls}"><span class="arr">${arr}<sup>${arr===1?"er":"e"}</sup> Arr<sup>t</sup></span><span class="street">${street}</span></span>`;

const SCREENS={
  home:()=>`${bar()}
   <section class="home-hero">
     <span class="plaque hero"><span class="arr">Visites thématiques</span><span class="street">Flânerie</span></span>
     <p class="lede">${t("tagline")}</p>
   </section>
   <h2 class="label">${t("cities")}</h2>
   ${CITIES.map(c=>`<button class="choice" ${c.active?`data-action="go" data-to="themes"`:"disabled"}>
     <span class="name">${L(c.name)}</span>${c.active?I.chev:`<span class="soon">${t("soon")}</span>`}</button>`).join("")}
   <p class="note">${t("langsSoon")} ${t("demo")}</p>`,

  themes:()=>`${bar("home")}
   <h1>Paris</h1><p class="sub">${t("themes")}</p>
   <div style="margin-top:18px">${THEMES.map(th=>`<button class="choice" ${th.active?`data-action="theme" data-id="${th.id}"`:"disabled"}>
     <span><span class="name">${L(th.name)}</span><span class="desc">${L(th.desc)}</span></span>${th.active?I.chev:`<span class="soon">${t("soon")}</span>`}</button>`).join("")}</div>`,

  routes:()=>{const list=ROUTES.filter(r=>state.filter==="all"||(state.filter==="short"?r.duration<6:r.duration>=6));
   return `${bar("themes")}
   <h1>${L(THEMES[0].name)}</h1><p class="sub">${t("routes")}</p>
   <div class="filters" role="group">
     ${["all","short","day"].map(f=>`<button class="chip" data-action="filter" data-f="${f}" aria-pressed="${state.filter===f}">${t(f)}</button>`).join("")}
   </div>
   ${list.map(r=>`<button class="route" data-action="route" data-id="${r.id}">
     <span class="thumb">${mapSVG(r,false)}</span>
     <span><span class="title">${r.title}</span>
     <span class="facts" style="display:block">${t("hours",r.duration)}, ${t("places",r.stops.length)}<br>${t(r.mode)}, ${t("km",routeKm(r))}</span></span></button>`).join("")}`},

  route:()=>{const r=routeById(state.route);
   let items="";
   r.stops.forEach((id,i)=>{const p=PLACES[id];
     items+=`<li class="stop"><span class="num">${i+1}</span><button data-action="open" data-i="${i}"><span class="t">${p.title}</span><span class="h">${p.hook}</span></button></li>`;
     if(i<r.stops.length-1){const lg=legOf(r,id,r.stops[i+1]);
       items+=`<li class="leg${lg?" metro":""}"><i></i><span>${lg?L(lg):t("walkMin",walkMinutes(id,r.stops[i+1]))}</span></li>`}});
   return `${bar("routes")}
   <p class="sub" style="margin-top:8px">${L(r.arr)}</p>
   <h1>${r.title}</h1>
   ${fallback()}
   <div class="map">${mapSVG(r,true)}</div><p class="caption">${t("mapNote")}</p>
   <div class="facts-row">
     <div class="fact"><b>${t("hours",r.duration)}</b><span>${t("duration")}</span></div>
     <div class="fact"><b>${routeKm(r)} km</b><span>${t("distance")}</span></div>
     <div class="fact"><b>${r.stops.length}</b><span>${t("count")}</span></div>
   </div>
   <p class="intro">${r.intro}</p>
   <ol class="stops">${items}</ol>
   <button class="primary" data-action="open" data-i="0">${t("start")}</button>`},

  place:()=>{const r=routeById(state.route),n=r.stops.length,i=state.idx,p=PLACES[r.stops[i]];
   const nextLeg=i<n-1?(legOf(r,r.stops[i],r.stops[i+1])?L(legOf(r,r.stops[i],r.stops[i+1])):t("walkMin",walkMinutes(r.stops[i],r.stops[i+1]))):"";
   return `${bar("route")}
   <div class="progress" aria-hidden="true">${r.stops.map((_,k)=>`<span class="${k<=i?"on":""}"></span>`).join("")}</div>
   <p class="step-label">${t("step",i+1,n)}</p>
   ${plaque(p.arr,p.street,"wide")}
   <h1>${p.title}</h1>
   ${fallback()}
   <p class="hook">${p.hook}</p>
   <div class="body">${p.text.map(x=>`<p>${x}</p>`).join("")}</div>
   <div class="photo"><b>${t("photoTitle")}</b>${t("photoText")}</div>
   <dl class="practical"><dt>${t("address")}</dt><dd>${p.address}</dd><dt>${t("access")}</dt><dd>${p.access}</dd></dl>
   <p class="sources">${t("sources")} : ${p.sources}</p>
   <div class="nav">
     <button data-action="step" data-d="-1"${i===0?" disabled":""}>${t("prev")}</button>
     <button class="next" data-action="step" data-d="1">${i===n-1?t("finish"):t("next")}</button>
   </div>
   ${nextLeg?`<p class="caption" style="text-align:right;margin-top:10px">${nextLeg}</p>`:""}`},

  done:()=>{const r=routeById(state.route);return `${bar("route")}
   <section class="done">${plaque(PLACES[r.stops[r.stops.length-1]].arr,t("doneTitle"),"hero")}
   <p class="lede">${t("doneText")}</p>
   <button class="primary" data-action="go" data-to="routes">${t("others")}</button></section>`}
};

/* ---------- Audio (synthèse vocale de l’appareil : coût nul, hors ligne) ---------- */
const audio={status:"idle",token:0,parts:[],at:0};
const hasSpeech="speechSynthesis" in window;
function frVoice(){return (speechSynthesis.getVoices()||[]).find(v=>(v.lang||"").toLowerCase().startsWith("fr"))}
function stopAudio(){audio.token++;if(hasSpeech)speechSynthesis.cancel();audio.status="idle";audio.at=0}
function speakFrom(k){
  const my=++audio.token;speechSynthesis.cancel();
  if(k>=audio.parts.length){audio.status="idle";audio.at=0;renderPlayer();return}
  audio.at=k;const u=new SpeechSynthesisUtterance(audio.parts[k]);u.lang="fr-FR";const v=frVoice();if(v)u.voice=v;u.rate=state.rate;
  u.onend=()=>{if(my===audio.token)speakFrom(k+1)};
  speechSynthesis.speak(u);audio.status="playing";renderPlayer();
}
function togglePlay(){
  if(!hasSpeech)return;
  if(audio.status==="playing"){speechSynthesis.pause();audio.status="paused"}
  else if(audio.status==="paused"){speechSynthesis.resume();audio.status="playing"}
  else{const r=routeById(state.route),p=PLACES[r.stops[state.idx]];
    audio.parts=[p.title+".",p.hook,...p.text.join(" ").split(/(?<=[.!?])\s+/)];speakFrom(0);return}
  renderPlayer();
}
function cycleRate(){const rates=[0.9,1,1.15];state.rate=rates[(rates.indexOf(state.rate)+1)%rates.length];
  if(audio.status==="playing")speakFrom(audio.at);else renderPlayer()}
function renderPlayer(){
  const slot=document.getElementById("player-slot");
  if(state.screen!=="place"){slot.innerHTML="";return}
  const r=routeById(state.route),p=PLACES[r.stops[state.idx]];
  const st=!hasSpeech?t("noSpeech"):audio.status==="playing"?t("playing"):audio.status==="paused"?t("paused"):t("listen");
  slot.innerHTML=`<div class="player"><div class="player-in">
    <button class="play" data-action="play" aria-label="${audio.status==="playing"?t("paused"):t("listen")}"${hasSpeech?"":" disabled"}>${audio.status==="playing"?I.pause:I.play}</button>
    <div class="ptext"><b>${p.title}</b><span>${st}</span></div>
    <button class="speed" data-action="rate" aria-label="Vitesse">${state.rate.toLocaleString(state.lang)}×</button>
  </div></div>`;
}

/* ---------- Rendu et événements ---------- */
function render(){
  stopAudio();
  document.documentElement.lang=state.lang;
  const app=document.getElementById("app");
  app.innerHTML=`<div class="screen">${SCREENS[state.screen]()}</div>`;
  renderPlayer();window.scrollTo(0,0);
}
function go(screen){state.screen=screen;render()}
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-action]");if(!el||el.disabled)return;
  const a=el.dataset.action;
  if(a==="go")go(el.dataset.to);
  else if(a==="theme"){state.theme=el.dataset.id;go("routes")}
  else if(a==="filter"){state.filter=el.dataset.f;render()}
  else if(a==="route"){state.route=el.dataset.id;go("route")}
  else if(a==="open"){state.idx=+el.dataset.i;go("place")}
  else if(a==="step"){const n=routeById(state.route).stops.length,j=state.idx+ +el.dataset.d;
    if(j>=n)go("done");else if(j>=0){state.idx=j;go("place")}}
  else if(a==="play")togglePlay();
  else if(a==="rate")cycleRate();
});
document.addEventListener("change",e=>{
  if(e.target.dataset.action==="lang"){state.lang=e.target.value;try{localStorage.setItem("flanerie-lang",state.lang)}catch(_){}render()}
});
if(hasSpeech)speechSynthesis.onvoiceschanged=()=>{};
render();
</script>
